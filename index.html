<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mia Group 派送營運工作台</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #e74c3c;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 15px;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
    }
    .btn-danger { background: var(--accent-color); }
    .btn-success { background: #27ae60; }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
    }
    .hidden { display: none !important; }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .badge {
      background: #e17055;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 頁面頂部資訊 -->
  <div class="card header-bar">
    <div>
      <h2 style="margin:0;">🚚 Mia Group 營運系統</h2>
      <small id="user-display-status">目前身分：未登入</small>
    </div>
    <button class="btn btn-danger" style="width: auto;" onclick="logout()">登出帳號</button>
  </div>

  <!-- 管理員 / 步兵 專用版面區塊 -->
  <div id="main-dashboard" class="hidden">
    <div class="card">
      <h3>📋 營運日報表 & 違規紀錄</h3>
      <p>歡迎登入系統，請選擇相應的操作功能。</p>
      <div id="admin-only-tools" class="hidden">
        <span class="badge">Admin 權限</span>
        <p style="color: #27ae60; font-weight: bold;">登入者：管理員 (Mia)</p>
        <button class="btn btn-success" onclick="exportLeaderboardWhatsApp()">📤 匯出 WhatsApp 違規龍虎榜</button>
      </div>
      <div id="staff-only-tools" class="hidden">
        <span class="badge" style="background:#0984e3;">步兵 / 司機權限</span>
        <p>請輸入您的每日派送紀錄。</p>
      </div>
    </div>
  </div>
</div>

<!-- 帳號登入 Modal 彈窗 -->
<div id="login-modal" class="modal">
  <div class="modal-content">
    <h3 style="margin-top:0;">🔐 請先登入帳號</h3>
    <p style="font-size: 13px; color: #666;">請輸入您的步兵/管理員帳號與密碼：</p>
    
    <label>帳號：</label>
    <input type="text" id="login-username" placeholder="請輸入帳號 (例如: rider01)">
    
    <label>密碼：</label>
    <input type="password" id="login-password" placeholder="請輸入密碼">
    
    <button class="btn" onclick="processLogin()">登入系統</button>
  </div>
</div>

<script>
  // Google Apps Script API 網址 (請替換為你的 Web App URL)
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";

  // 全域身分狀態
  let currentUser = null;
  let currentRole = null;

  // 1. 頁面載入初始化
  document.addEventListener('DOMContentLoaded', () => {
    // 檢查網址是否帶有 ?logout=true 參數
    const urlParams = new URLSearchParams(window.location.search);
    const isForceLogout = urlParams.get('logout') === 'true';

    // 如果帶有 logout 參數，強制清空所有本地儲存登入紀錄
    if (isForceLogout) {
      localStorage.clear();
      sessionStorage.clear();
      window.currentUser = null;
      window.currentRole = null;

      // 清除網址列上的 ?logout=true，保持網址乾淨
      window.history.replaceState({}, document.title, window.location.pathname);
      console.log('🔒 已強制登出，清空所有快照。');
    }

    // 檢查是否有歷史登入紀錄
    const savedUser = localStorage.getItem('currentUser');
    const savedRole = localStorage.getItem('currentRole');

    if (savedUser && savedRole) {
      currentUser = savedUser;
      currentRole = savedRole;
      showDashboard();
    } else {
      showLoginModal();
    }
  });

  // 2. 顯示登入視窗
  function showLoginModal() {
    document.getElementById('main-dashboard').classList.add('hidden');
    document.getElementById('login-modal').style.display = 'flex';
  }

  // 3. 執行登入邏輯
  function processLogin() {
    const u = document.getElementById('login-username').value.trim();
    const p = document.getElementById('login-password').value.trim();

    if (!u || !p) {
      alert('請輸入帳號與密碼！');
      return;
    }

    // 身分驗證 (可根據你的需求擴充帳密邏輯)
    if (u === 'mia' && p === '940812') {
      currentUser = 'Mia';
      currentRole = 'admin';
    } else {
      // 預設其他帳號均為一般步兵/司機
      currentUser = u;
      currentRole = 'staff';
    }

    // 儲存登入狀態至本地
    localStorage.setItem('currentUser', currentUser);
    localStorage.setItem('currentRole', currentRole);

    document.getElementById('login-modal').style.display = 'none';
    showDashboard();
  }

  // 4. 切換顯示對應身分的版面
  function showDashboard() {
    document.getElementById('main-dashboard').classList.remove('hidden');
    document.getElementById('user-display-status').textContent = `目前登入：${currentUser} (${currentRole === 'admin' ? '管理員' : '步兵'})`;

    if (currentRole === 'admin') {
      document.getElementById('admin-only-tools').classList.remove('hidden');
      document.getElementById('staff-only-tools').classList.add('hidden');
    } else {
      document.getElementById('admin-only-tools').classList.add('hidden');
      document.getElementById('staff-only-tools').classList.remove('hidden');
    }
  }

  // 5. 登出邏輯
  function logout() {
    localStorage.clear();
    sessionStorage.clear();
    currentUser = null;
    currentRole = null;
    alert('已成功登出！');
    showLoginModal();
  }

  // 6. WhatsApp 格式匯出（範例）
  function exportLeaderboardWhatsApp() {
    alert('已生成 WhatsApp 違規龍虎榜！');
  }
</script>

</body>
</html>
