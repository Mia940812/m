<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mia組 - 派件營運全功能工作台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { height: 5px; width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 999px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .app-modal { position: fixed; inset: 0; z-index: 9999; background-color: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 12px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- 頂部音效提示橫幅 -->
  <div id="hourly-alert-banner" class="hidden fixed top-2 left-1/2 -translate-x-1/2 z-50 bg-rose-600 text-white px-4 py-2 rounded-xl shadow-lg flex items-center gap-2 text-xs font-bold animate-bounce">
    <span>🔔</span> <span id="hourly-alert-text">你有待處理工單，請盡快跟進！</span>
    <button onclick="document.getElementById('hourly-alert-banner').classList.add('hidden')" class="ml-2 text-white hover:text-slate-200">✕</button>
  </div>

  <!-- 頂部 Header -->
  <header class="bg-slate-900 text-white px-4 py-3 sticky top-0 z-40 shadow-sm bg-opacity-95">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="px-2.5 py-1 bg-slate-800 border border-slate-700 text-blue-400 rounded-lg font-black text-xs tracking-wider">Mia組</div>
        <div>
          <div class="text-xs font-bold text-slate-100 flex items-center gap-1.5">
            <span>派件營運管理中心</span>
            <span id="role-display-badge" class="px-1.5 py-0.5 rounded text-[10px] bg-blue-900/80 text-blue-300 border border-blue-700 font-semibold">👑 總管理員 (Mia)</span>
          </div>
          <div id="cloud-status-badge" class="text-[10px] text-emerald-400 font-semibold">🟢 Google 雲端數據庫已連線</div>
        </div>
      </div>

      <!-- 身份切換、修改密碼與系統控制 -->
      <div class="flex items-center gap-2 text-xs">
        <div id="account-switch-container" class="flex items-center gap-1.5">
          <span class="text-[11px] text-slate-400 font-bold hidden sm:inline">當前帳戶:</span>
          <select id="current-user-role-select" onchange="promptRoleSwitch(this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 rounded-lg px-2 py-1 font-bold focus:outline-none"></select>
        </div>

        <button type="button" onclick="openChangePasswordModal()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold transition flex items-center gap-1">
          <span>🔑</span> 修改密碼
        </button>
        <button type="button" onclick="logoutCurrentSession()" class="px-2 py-1 rounded-lg bg-rose-950/80 hover:bg-rose-900 text-rose-300 border border-rose-800 font-bold transition">
          登出
        </button>
        <input id="global-system-date" type="date" class="bg-slate-800 border border-slate-700 text-slate-200 rounded-lg px-2 py-1 font-bold focus:outline-none">
        <button type="button" id="btn-reset-sys" onclick="resetSystemData()" title="重置為初始狀態" class="text-[11px] px-2 py-1 rounded-lg bg-slate-800 hover:bg-rose-950 text-slate-400 hover:text-rose-300 transition">重置</button>
      </div>
    </div>
  </header>

  <!-- 核心功能導航欄 -->
  <nav class="bg-white border-b border-slate-200 sticky top-[53px] z-30 shadow-xs">
    <div id="navigation-bar-container" class="max-w-7xl mx-auto px-4 py-2 flex flex-wrap items-center gap-1.5 text-xs font-bold">
      <button type="button" id="btn-nav-leaderboard" onclick="openLeaderboardModal()" class="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white flex items-center gap-1 shadow-xs animate-pulse"><span>🏆</span> 罰款獎池與龍虎榜</button>
      <button type="button" id="btn-nav-tickets" onclick="openTicketsModal()" class="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-800 border border-rose-200 relative">🚨 異常工單 <span id="ticket-badge-count" class="hidden ml-1 px-1.5 py-0.2 bg-rose-600 text-white rounded-full text-[9px]">0</span></button>
      <button type="button" id="btn-nav-export-truck" onclick="openUniversalExportModal('truck_dispatch')" class="px-3 py-1.5 rounded-xl bg-slate-900 text-white flex items-center gap-1 shadow-xs"><span>🚗</span> 匯出車線</button>
      <button type="button" id="btn-nav-export-shift" onclick="openUniversalExportModal('shift_schedule')" class="px-3 py-1.5 rounded-xl bg-slate-800 text-white flex items-center gap-1 shadow-xs"><span>📤</span> 匯出14天更表</button>
      <button type="button" id="btn-nav-profit" onclick="openModalProfit()" class="px-3 py-1.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white shadow-xs">📈 營運利潤</button>
      <button type="button" id="btn-nav-settle" onclick="openModalSettlementDaily()" class="px-3 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white shadow-xs">💰 詳細分區埋數</button>
      <button type="button" id="btn-nav-supplies" onclick="openSuppliesModal()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200">📦 物資採購</button>
      <button type="button" id="btn-nav-progress" onclick="openModalProgress()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200">⏱️ 圍欄進度</button>
      <button type="button" id="btn-nav-fences" onclick="openModal1()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200">📍 1- 圍欄管理</button>
      <button type="button" id="btn-nav-assign" onclick="openModal2()" class="px-3 py-1.5 rounded-xl bg-blue-700 hover:bg-blue-800 text-white shadow-xs">👥 2- 區域排班</button>
      <button type="button" id="btn-nav-kt" onclick="openModal3()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200">📦 3- 觀塘貨量</button>
      <button type="button" id="btn-nav-east" onclick="openModal4()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200">🏢 4- 東區貨量</button>
      <button type="button" id="btn-nav-st" onclick="openModalStCounts()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200">🏞️ 4b- 沙田貨量</button>
      <button type="button" id="btn-nav-shifts" onclick="openModal5()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200">⏰ 5- 14天報更</button>
      <button type="button" id="btn-nav-trucks" onclick="openModal8()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200">🚗 8- 車線調度</button>
      <button type="button" id="btn-nav-recruits" onclick="openRecruitsModal()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200">📋 預約新人</button>
      <button type="button" id="btn-nav-add-staff" onclick="openAddRiderModal()" class="px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white shadow-xs">➕ 新增人員/專屬票價</button>
    </div>
  </nav>

  <!-- 主內容工作區 -->
  <main class="max-w-7xl mx-auto p-3 sm:p-5 flex-1 w-full space-y-4">
    <div id="dashboard-summary-cards" class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 sm:gap-3"></div>

    <!-- 每日報數與薪酬結算錄入中心 -->
    <div id="report-entry-panel" class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-xs space-y-4">
      <div class="border-b border-slate-100 pb-2.5 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <h2 id="report-entry-title" class="text-xs sm:text-sm font-black text-slate-900 flex items-center gap-2">
            <span class="w-2 h-4 bg-slate-800 rounded"></span> 📝 每日派件報數與薪資結算表單
          </h2>
          <button type="button" id="btn-admin-price-cfg" onclick="openModalPriceSettings()" class="px-2 py-0.5 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded text-[11px] font-bold">⚙️ 修改全域預設票價</button>
        </div>
        <span class="text-[11px] text-slate-400 font-semibold">自動匹配人員個別專屬票價 ➜ 實時計算同步</span>
      </div>

      <form onsubmit="saveFullDailyReport(event)" class="space-y-4 text-xs">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 bg-slate-50/80 p-3 rounded-xl border border-slate-200">
          <div>
            <label class="block font-bold text-slate-700 mb-1">派送日期</label>
            <input type="date" id="repDate" required class="w-full px-3 py-1.5 bg-white border border-slate-300 rounded-lg font-bold">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">司機 / 步兵身份</label>
            <select id="repStaffSelect" onchange="onStaffSelectChange(this.value)" required class="w-full px-3 py-1.5 bg-white border border-slate-300 rounded-lg font-bold text-slate-900"></select>
          </div>
        </div>

        <!-- 分區派件票數 -->
        <div class="p-3.5 bg-slate-50/60 rounded-xl border border-slate-200 space-y-2.5">
          <div class="font-bold text-slate-800 flex items-center justify-between text-xs">
            <span>📦 1. 分區派件報數</span>
            <span id="staff-price-badge" class="text-[11px] font-bold text-blue-700">當前套用：預設單價</span>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-4 gap-2">
            <div class="bg-white p-2.5 rounded-lg border border-slate-200 space-y-1.5">
              <div class="font-bold text-slate-700">📍 東區 (41圍欄)</div>
              <div class="flex items-center gap-1">
                <input type="number" id="repEastCount" min="0" placeholder="票數" oninput="calcSalaryLive()" class="w-1/2 p-1.5 bg-slate-50 border rounded text-center font-bold text-blue-700">
                <span class="text-slate-400">×$</span>
                <input type="number" id="repEastPrice" step="0.1" placeholder="單價" oninput="calcSalaryLive()" class="w-1/2 p-1.5 bg-slate-50 border rounded text-center font-bold">
              </div>
            </div>
            <div class="bg-white p-2.5 rounded-lg border border-slate-200 space-y-1.5">
              <div class="font-bold text-slate-700">📍 觀塘麗港城</div>
              <div class="flex items-center gap-1">
                <input type="number" id="repKtLgCount" min="0" placeholder="票數" oninput="calcSalaryLive()" class="w-1/2 p-1.5 bg-slate-50 border rounded text-center font-bold text-blue-700">
                <span class="text-slate-400">×$</span>
                <input type="number" id="repKtLgPrice" step="0.1" placeholder="單價" oninput="calcSalaryLive()" class="w-1/2 p-1.5 bg-slate-50 border rounded text-center font-bold">
              </div>
            </div>
            <div class="bg-white p-2.5 rounded-lg border border-slate-200 space-y-1.5">
              <div class="font-bold text-slate-700">📍 觀塘工商區</div>
              <div class="flex items-center gap-1">
                <input type="number" id="repKtIndCount" min="0" placeholder="票數" oninput="calcSalaryLive()" class="w-1/2 p-1.5 bg-slate-50 border rounded text-center font-bold text-blue-700">
                <span class="text-slate-400">×$</span>
                <input type="number" id="repKtIndPrice" step="0.1" placeholder="單價" oninput="calcSalaryLive()" class="w-1/2 p-1.5 bg-slate-50 border rounded text-center font-bold">
              </div>
            </div>
            <div class="bg-white p-2.5 rounded-lg border border-slate-200 space-y-1.5">
              <div class="font-bold text-slate-700">📍 沙田 F58</div>
              <div class="flex items-center gap-1">
                <input type="number" id="repStCount" min="0" placeholder="票數" oninput="calcSalaryLive()" class="w-1/2 p-1.5 bg-slate-50 border rounded text-center font-bold text-blue-700">
                <span class="text-slate-400">×$</span>
                <input type="number" id="repStPrice" step="0.1" placeholder="單價" oninput="calcSalaryLive()" class="w-1/2 p-1.5 bg-slate-50 border rounded text-center font-bold">
              </div>
            </div>
          </div>
        </div>

        <div class="bg-white p-2.5 rounded-xl border border-slate-200 flex justify-between items-center mt-1">
          <span class="font-bold text-slate-700 text-xs">當日應發總工資結算：</span>
          <span id="repLiveTotalSalary" class="font-black text-slate-900 text-sm">HK$ 0.00</span>
        </div>

        <button type="submit" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs shadow-sm transition">
          確認提交報數紀錄 (同步 Google Sheet)
        </button>
      </form>
    </div>
  </main>

  <!-- 👥 2- 區域排班 Modal -->
  <div id="modal-assignments" class="app-modal" style="display: none;">
    <div class="bg-white rounded-2xl p-4 sm:p-5 max-w-4xl w-full shadow-2xl space-y-3.5 max-h-[92vh] overflow-y-auto custom-scrollbar">
      <div class="flex justify-between items-center border-b pb-2">
        <div>
          <h3 class="font-bold text-sm text-slate-900">👥 2- 區域排班看板（各圍欄負責步兵與人數）</h3>
          <span class="text-[11px] text-slate-400 font-medium">每個圍欄直接顯示幾多位步兵，點擊名字旁邊 ✕ 可直接移除</span>
        </div>
        <button type="button" onclick="closeModal('modal-assignments')" class="text-slate-400 hover:text-slate-700 font-bold">✕</button>
      </div>

      <!-- 分區切換 -->
      <div class="flex gap-2 text-xs font-bold">
        <button type="button" onclick="switchAssignmentTab('east')" id="tab-assign-east" class="px-3 py-1.5 rounded-lg bg-slate-900 text-white transition">📍 東區 (41圍欄)</button>
        <button type="button" onclick="switchAssignmentTab('kt')" id="tab-assign-kt" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 transition">📍 觀塘區</button>
        <button type="button" onclick="switchAssignmentTab('st')" id="tab-assign-st" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 transition">📍 沙田區 (F58)</button>
      </div>
      
      <!-- 快速指派面板 -->
      <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs space-y-2">
        <div class="font-bold text-slate-700">➕ 指派步兵到圍欄 / 屋苑：</div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-slate-500 mb-0.5">選擇步兵</label>
            <select id="new-assign-rider-select" class="w-full bg-white border border-slate-300 rounded-lg p-2 font-bold text-slate-900"></select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-500 mb-0.5">指派目標屋苑 / 圍欄</label>
            <select id="new-assign-fence-select" class="w-full bg-white border border-slate-300 rounded-lg p-2 font-bold text-slate-900"></select>
          </div>
        </div>
        <button type="button" onclick="saveNewAssignmentRow()" class="w-full py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg font-bold shadow-xs">
          確認指派步兵到此圍欄
        </button>
      </div>

      <!-- 圍欄看板清單 -->
      <div class="font-bold text-xs text-slate-700 pt-1">各圍欄排班狀況看板：</div>
      <div id="m2-fences-board-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5 text-xs max-h-72 overflow-y-auto custom-scrollbar"></div>
      
      <div class="flex gap-2 pt-1 border-t">
        <button type="button" onclick="openUniversalExportModal('shift_schedule')" class="flex-1 py-2 bg-slate-800 text-white rounded-xl text-xs font-bold">匯出排班名冊 (WhatsApp)</button>
        <button type="button" onclick="closeModal('modal-assignments')" class="px-4 py-2 bg-slate-100 rounded-xl text-xs font-bold">關閉</button>
      </div>
    </div>
  </div>

  <!-- 匯出 Modal -->
  <div id="modal-universal-export" class="app-modal" style="display: none;">
    <div class="bg-white rounded-2xl p-4 sm:p-5 max-w-2xl w-full shadow-2xl space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="export-modal-title" class="font-bold text-sm text-slate-900">📤 匯出排班名冊</h3>
        <button type="button" onclick="closeModal('modal-universal-export')" class="text-slate-400 hover:text-slate-700 font-bold">✕</button>
      </div>
      <textarea id="universal-export-textarea" rows="13" readonly class="w-full bg-slate-50 border rounded-xl p-3 font-mono text-xs focus:outline-none"></textarea>
      <div class="flex gap-2">
        <button type="button" onclick="copyUniversalWhatsAppText()" class="flex-1 py-2.5 bg-slate-900 text-white rounded-xl text-xs font-bold">一鍵複製 WhatsApp 格式</button>
        <button type="button" onclick="closeModal('modal-universal-export')" class="px-5 py-2.5 bg-slate-100 rounded-xl text-xs font-bold">關閉</button>
      </div>
    </div>
  </div>

  <!-- JavaScript 核心引擎 -->
  <script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwG5x-iN6GjVd1jtdoz11Nwn79JLSLdLrIDr_xXfNCyfo1EBxfYPUFb5oW754GXf7H4fA/exec';

    const defaultZoneFences = {
      st: [
        { name: 'F58' },
        { name: '廣源邨' }

        { name: '65F 富景花園' }, { name: '67F 杏花園' }, { name: '68F 東大街板A' },

    function renderRoleView() {

          `<option value="${a.name}" ${currentRole === a.name ? 'selected' : ''}>${a.name} (${a.category || '步兵'})</option>`
        ).join('');
        selectEl.innerHTML = opts;
      }

      const badge = document.getElementById('role-display-badge');
      if (badge) {
        if (currentRole === 'admin') {
          badge.textContent = '👑 總管理員 (Mia)';
          badge.className = 'px-1.5 py-0.5 rounded text-[10px] bg-blue-900/80 text-blue-300 border border-blue-700 font-semibold';
        } else {
          const userObj = accounts.find(a => a.name === currentRole);
          badge.textContent = `👤 ${userObj ? userObj.name : currentRole} (${userObj ? userObj.category : '步兵'})`;

    function promptRoleSwitch(targetRole) {

          renderRoleView();
        } else {

        }
      } else {
        currentRole = targetRole;
        localStorage.setItem('MIA_LOGGED_IN_USER', currentRole);
        alert(`✅ 已切換為【${targetRole}】帳戶！`);

    async function loadCloudData() {
      if (!GOOGLE_SCRIPT_URL) return;
      try {
        const resAcc = await fetch(`${GOOGLE_SCRIPT_URL}?action=getAccounts&_t=${Date.now()}`);
        const cloudAccounts = await resAcc.json();
        if (Array.isArray(cloudAccounts) && cloudAccounts.length > 0) {
          accounts = cloudAccounts;
          localStorage.setItem('MIA_ACCOUNTS_PERFECT', JSON.stringify(accounts));
          renderRoleView();
        }
      } catch (err) {}
    }

    function syncSingleRecord(key, record) {
      if (!GOOGLE_SCRIPT_URL) return;
      try {
        fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ key: key, data: record }),
          mode: 'no-cors'
        });
      } catch (err) {}
    }

    function switchAssignmentTab(tab) {
      currentAssignTab = tab;
      ['east', 'kt', 'st'].forEach(t => {
        const btn = document.getElementById(`tab-assign-${t}`);
        if (btn) {
          btn.className = (t === tab) 
            ? 'px-3 py-1.5 rounded-lg bg-slate-900 text-white font-bold transition'
            : 'px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 font-bold transition';
        }
      });
      renderAssignmentsBoard();
    }

    function renderAssignmentsBoard() {
      const riderSel = document.getElementById('new-assign-rider-select');
      if (riderSel) {
        riderSel.innerHTML = '<option value="">-- 請選擇步兵 --</option>' + 
          accounts.filter(a => a.name !== 'Mia').map(a => `<option value="${a.name}">${a.name} (${a.id || 'KM'})</option>`).join('');
      }

      const fenceSel = document.getElementById('new-assign-fence-select');
      const fences = defaultZoneFences[currentAssignTab] || [];
      if (fenceSel) {
        fenceSel.innerHTML = '<option value="">-- 請選擇屋苑/圍欄 --</option>' + 
          fences.map(f => `<option value="${f.name}">${f.name}</option>`).join('');
      }

      const grid = document.getElementById('m2-fences-board-grid');
      if (!grid) return;

      const currentList = zoneAssignments[currentAssignTab] || [];

      grid.innerHTML = fences.map(f => {
        const assignedStaff = currentList.filter(item => item.fence === f.name);
        const staffCount = assignedStaff.length;

        return `
          <div class="p-3 bg-slate-50 border ${staffCount > 0 ? 'border-blue-200 bg-blue-50/20' : 'border-slate-200'} rounded-xl flex flex-col justify-between space-y-2 shadow-2xs">
            <div class="flex items-center justify-between">
              <span class="font-black text-slate-900 text-xs">📍 ${f.name}</span>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${staffCount > 0 ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-500'}">
                ${staffCount} 人
              </span>
            </div>

            <div class="flex flex-wrap gap-1 min-h-[26px] items-center">
              ${staffCount === 0 
                ? '<span class="text-[11px] text-slate-400 font-semibold italic">暫未排人</span>'
                : assignedStaff.map(s => `
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 bg-white border border-blue-300 text-blue-900 rounded-lg text-[11px] font-bold shadow-2xs">
                      ${s.name}
                      <button type="button" onclick="removeStaffFromFence('${s.name}', '${f.name}')" title="移除此步兵" class="text-rose-500 hover:text-rose-700 text-xs font-black ml-0.5">✕</button>
                    </span>
                  `).join('')
              }
            </div>
          </div>
        `;
      }).join('');
    }

    function saveNewAssignmentRow() {
      const rider = document.getElementById('new-assign-rider-select').value;
      const fence = document.getElementById('new-assign-fence-select').value;

      if (!rider || !fence) return alert('請先選擇步兵姓名及負責圍欄！');

      if (!zoneAssignments[currentAssignTab]) zoneAssignments[currentAssignTab] = [];
      const exists = zoneAssignments[currentAssignTab].some(item => item.name === rider && item.fence === fence);
      if (exists) return alert(`【${rider}】已經在【${fence}】名單中！`);

      zoneAssignments[currentAssignTab].push({ name: rider, fence: fence });
      localStorage.setItem('MIA_ASSIGNS_PERFECT', JSON.stringify(zoneAssignments));
      renderAssignmentsBoard();

      syncSingleRecord('區域排班', {
        area: currentAssignTab === 'st' ? '沙田' : (currentAssignTab === 'kt' ? '觀塘' : '東區'),
        staff: rider,
        zone: fence
      });

      alert(`✅ 成功將【${rider}】指派到 ${fence}！`);
    }

    function removeStaffFromFence(riderName, fenceName) {
      if (confirm(`確定將【${riderName}】從【${fenceName}】移除？`)) {
        zoneAssignments[currentAssignTab] = (zoneAssignments[currentAssignTab] || []).filter(
          item => !(item.name === riderName && item.fence === fenceName)
        );
        localStorage.setItem('MIA_ASSIGNS_PERFECT', JSON.stringify(zoneAssignments));
        renderAssignmentsBoard();
      }
    }

    function onStaffSelectChange(name) { calcSalaryLive(); }

    function calcSalaryLive() {
      const eastC = Number(document.getElementById('repEastCount')?.value) || 0;
      const ktLgC = Number(document.getElementById('repKtLgCount')?.value) || 0;
      const ktIndC = Number(document.getElementById('repKtIndCount')?.value) || 0;
      const stC = Number(document.getElementById('repStCount')?.value) || 0;
      const total = (eastC * 8.5) + (ktLgC * 8.0) + (ktIndC * 7.5) + (stC * 7.5);
      const el = document.getElementById('repLiveTotalSalary');
      if (el) el.textContent = `HK$ ${total.toFixed(2)}`;
    }

    function openUniversalExportModal(type) {
      const textarea = document.getElementById('universal-export-textarea');
      if (!textarea) return;

      let content = `👥 【Mia組 - 各區圍欄排班狀況名冊】\n========================================\n`;
      const zoneNames = { east: '東區', kt: '觀塘區', st: '沙田區' };
      ['east', 'kt', 'st'].forEach(zone => {
        content += `\n📍 【${zoneNames[zone]}】\n----------------------------------------\n`;
        const fences = defaultZoneFences[zone] || [];
        const assigns = zoneAssignments[zone] || [];

        fences.forEach(f => {
          const staffList = assigns.filter(a => a.fence === f.name).map(a => a.name);
          const count = staffList.length;
          if (count > 0) {
            content += `• ${f.name} (${count}人): ${staffList.join('、')}\n`;
          } else {
            content += `• ${f.name}: (暫未排人)\n`;
          }
        });
      });
      content += `\n========================================\n請各步兵準時到達負責圍欄！💪`;

      textarea.value = content;
      openModal('modal-universal-export');
    }

    function copyUniversalWhatsAppText() {
      const textarea = document.getElementById('universal-export-textarea');
      if (textarea) {
        textarea.select();
        navigator.clipboard.writeText(textarea.value).then(() => {

    }
