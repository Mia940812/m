<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mia組 - 派件營運工作台</title>
  <style>
    :root { --primary: #188038; --bg: #f8f9fa; --card-bg: #ffffff; --border: #dadce0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: #202124; padding: 15px; }
    .header { background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .auth-bar { background: #e8f0fe; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
    .nav-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
    .nav-tab { padding: 8px 14px; border: 1px solid transparent; background: var(--card-bg); border-radius: 6px; cursor: pointer; font-size: 0.9rem; border: 1px solid var(--border); }
    .nav-tab.active { background: #e6f4ea; color: #13652c; border-color: #ceead6; font-weight: 600; }
    .tab-content { display: none; background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border); overflow-x: auto; }
    .tab-content.active { display: block; }
    table { width: 100%; border-collapse: collapse; min-width: 800px; font-size: 0.88rem; }
    th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
    th { background: #f1f3f4; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
    .badge-ok { background: #e6f4ea; color: #137333; }
    .badge-pending { background: #fce8e6; color: #c5221f; }
  </style>
</head>
<body>

  <div class="header">
    <h2 style="color:var(--primary);">📦 Mia組系統工作台</h2>
    <span id="role-display" style="font-size:0.85rem; font-weight:600; color:#5f6368;">訪客模式 (限制存取)</span>
  </div>

  <!-- 身分驗證 / 切換 -->
  <div class="auth-bar">
    <label><strong>切換身分：</strong></label>
    <select id="user-select" onchange="handleAuthChange()" style="padding:4px 8px;">
      <option value="admin">管理員 (全權限)</option>
      <option value="盧智聰">步兵 - 盧智聰</option>
      <option value="姜嘉敏KK">步兵 - 姜嘉敏KK</option>
      <option value="俊華">組長 - 俊華</option>
      <option value="吳瑋儒">步兵 - 吳瑋儒</option>
      <option value="景鴻">步兵 - 景鴻</option>
      <option value="周健">步兵 - 周健</option>
      <option value="鄺家昊">步兵 - 鄺家昊</option>
      <option value="黃傅釧">步兵 - 黃傅釧</option>
      <option value="倪志康">步兵 - 倪志康 (KM隊)</option>
      <option value="王利民">步兵 - 王利民 (KM隊)</option>
      <option value="李健龍">步兵 - 李健龍 (KM隊)</option>
    </select>
  </div>

  <!-- 功能入口 -->
  <div class="nav-tabs" id="nav-bar">
    <button class="nav-tab active" onclick="switchTab('orders')">🚨 我的工單</button>
    <button class="nav-tab" id="tab-btn-settlement" onclick="switchTab('settlement')">📊 每日報數</button>
    <button class="nav-tab" onclick="switchTab('roster')">📅 我的報更</button>
    <button class="nav-tab" id="tab-btn-volume" onclick="switchTab('volume')">📈 8.20 貨量預估</button>
  </div>

  <!-- 工單區 -->
  <div id="orders" class="tab-content active">
    <table>
      <thead>
        <tr>
          <th>運單號碼</th>
          <th>負責人員</th>
          <th>收件人</th>
          <th>派送地址</th>
          <th>詳細情形</th>
          <th class="admin-only">罰款</th>
          <th class="admin-only">賠付</th>
          <th>狀態</th>
        </tr>
      </thead>
      <tbody id="orders-tbody"></tbody>
    </table>
  </div>

  <!-- 報數區 (僅管理員或本人) -->
  <div id="settlement" class="tab-content">
    <table>
      <thead>
        <tr><th>日期</th><th>姓名</th><th>身份</th><th>出糧週期</th><th>東區</th><th>麗港城</th><th>工商區</th><th>沙田</th><th>總票數</th><th>車津</th></tr>
      </thead>
      <tbody id="settlement-tbody"></tbody>
    </table>
  </div>

  <!-- 報更區 -->
  <div id="roster" class="tab-content">
    <table>
      <thead>
        <tr><th>日期</th><th>姓名</th><th>區域</th><th>圍欄</th><th>狀態</th><th>時間</th><th>備註</th></tr>
      </thead>
      <tbody id="roster-tbody"></tbody>
    </table>
  </div>

  <!-- 貨量區 -->
  <div id="volume" class="tab-content">
    <div style="display:flex; gap:20px; flex-wrap:wrap;">
      <div style="flex:1;"><h4 style="margin:8px 0; color:var(--primary);">觀塘區 (1,808)</h4><table id="kt-table"><thead><tr><th>代碼</th><th>圍欄</th><th>預估</th></tr></thead><tbody></tbody></table></div>
      <div style="flex:1;"><h4 style="margin:8px 0; color:var(--primary);">東區 (1,104)</h4><table id="east-table"><thead><tr><th>代碼</th><th>圍欄</th><th>預估</th></tr></thead><tbody></tbody></table></div>
    </div>
  </div>

  <script>
    const allOrders = [
      { no: "JT0025113529382", courier: "司機【Q-嘉-小魚】", name: "何**", addr: "九龍 觀塘區 麗港城9座12/F E室", details: "司機取件後無更新", status: "待處理" },
      { no: "JT0025144771644", courier: "王利民", name: "S**", addr: "九龍 觀塘工業中心 2期 地庫層 E&C室", details: "客戶反映未收到，需電聯", status: "待處理" },
      { no: "JT0025126536353", courier: "周健", name: "單**", addr: "九龍 觀塘區 麗港城27座24樓F室", details: "送達圖片不規範", status: "已解決" },
      { no: "JT0025130604190", courier: "倪志康", name: "金**", addr: "九龍 巧明街99號巧明工廠大廈9樓C20室", details: "反饋派錯門口，WhatsApp確認已收貨", status: "已解決" },
      { no: "JT0025187283810", courier: "鄺家昊", name: "何**", addr: "香港仔鴨脷洲大街145號金發大廈2樓D室", details: "簽收未收到，送錯位置", status: "待處理" },
      { no: "JT0025230532842", courier: "盧志聰", name: "M**", addr: "香港島 筲箕灣德雲樓4B", details: "送錯地址，需取回重派", status: "已處理" },
      { no: "JT0024973137081", courier: "王利民", name: "叶**", addr: "東旭苑 東麗閣 7層 703室", details: "收到非本人包裹", status: "待處理" },
      { no: "JT0024956449821", courier: "姜嘉敏KK", name: "杜**", addr: "麗港城 30座 5層 H室", details: "壞𨋢放座頭，客人已自取", status: "已解決" },
      { no: "JT0024958384876", courier: "李健龍", name: "吳**", addr: "康翠台 1座 10層 K室", details: "送錯地址未收到", status: "待處理" },
      { no: "JT0025057380466", courier: "吳瑋儒", name: "林**", addr: "萬年工業大廈 6樓A座 B3室", details: "送錯地址重派", status: "待處理" }
    ];

    const allSettlement = [
      { date: "2026-08-17", name: "俊華", role: "組長", cycle: "隔日糧", east: 222, laguna: 0, ind: 0, st: 0, total: 222, allow: 0 },
      { date: "2026-08-17", name: "吳瑋儒", role: "兼職", cycle: "半月糧", east: 0, laguna: 0, ind: 0, st: 59, total: 59, allow: 0 },
      { date: "2026-08-17", name: "倪志康", role: "兼職(KM)", cycle: "半月糧", east: 131, laguna: 99, ind: 0, st: 0, total: 230, allow: 50 },
      { date: "2026-08-17", name: "盧智聰", role: "全職", cycle: "隔日糧", east: 0, laguna: 112, ind: 86, st: 0, total: 198, allow: 0 },
      { date: "2026-08-17", name: "姜嘉敏KK", role: "全職", cycle: "隔日糧", east: 0, laguna: 107, ind: 97, st: 0, total: 204, allow: 0 }
    ];

    const allRoster = [
      { date: "2026-08-23", name: "景鴻", district: "東區", fence: "41圍欄", status: "全日出更", time: "9:00", note: "" },
      { date: "2026-08-20", name: "盧智聰", district: "觀塘", fence: "11E 麗港城", status: "全日出更", time: "10:00", note: "" },
      { date: "2026-08-20", name: "姜嘉敏KK", district: "觀塘", fence: "05E 工商區", status: "全日出更", time: "10:00", note: "" }
    ];

    const volumeKT = [{ code: "01E", name: "Koko Hills", vol: 66 }, { code: "02E", name: "觀塘工商區1號", vol: 350 }, { code: "11E", name: "麗港城-1號托", vol: 115 }];
    const volumeEast = [{ code: "03F", name: "東旭苑", vol: 131 }, { code: "64F", name: "愛東", vol: 182 }, { code: "19F", name: "漁灣", vol: 189 }];

    function renderView(currentUser) {
      const isAdmin = currentUser === 'admin';
      document.getElementById('role-display').textContent = isAdmin ? '目前身分：管理員 (可見全部數據)' : `目前身分：${currentUser} (僅限本人數據)`;

      // 控制管理員專屬欄位
      document.querySelectorAll('.admin-only').forEach(el => el.style.display = isAdmin ? '' : 'none');

      // 1. 工單過濾 (步兵只能看自己的)
      const filteredOrders = isAdmin ? allOrders : allOrders.filter(o => o.courier && o.courier.includes(currentUser));
      document.getElementById("orders-tbody").innerHTML = filteredOrders.length ? filteredOrders.map(o => `
        <tr>
          <td><strong>${o.no}</strong></td>
          <td>${o.courier}</td>
          <td>${o.name}</td>
          <td>${o.addr}</td>
          <td>${o.details}</td>
          <td class="admin-only"><input style="width:60px;"></td>
          <td class="admin-only"><input style="width:60px;"></td>
          <td><span class="badge ${o.status === '已解決' || o.status === '已處理' ? 'badge-ok' : 'badge-pending'}">${o.status}</span></td>
        </tr>
      `).join("") : `<tr><td colspan="8" style="text-align:center;color:#9aa0a6;">目前沒有指派給您的異常工單</td></tr>`;

      // 2. 報數過濾 (步兵只能看自己的報數)
      const filteredSettlement = isAdmin ? allSettlement : allSettlement.filter(s => s.name.includes(currentUser));
      document.getElementById("settlement-tbody").innerHTML = filteredSettlement.map(s => `
        <tr><td>${s.date}</td><td><strong>${s.name}</strong></td><td>${s.role}</td><td>${s.cycle}</td><td>${s.east}</td><td>${s.laguna}</td><td>${s.ind}</td><td>${s.st}</td><td><strong>${s.total}</strong></td><td>${s.allow}</td></tr>
      `).join("");

      // 3. 報更過濾
      const filteredRoster = isAdmin ? allRoster : allRoster.filter(r => r.name.includes(currentUser));
      document.getElementById("roster-tbody").innerHTML = filteredRoster.map(r => `
        <tr><td>${r.date}</td><td><strong>${r.name}</strong></td><td>${r.district}</td><td>${r.fence}</td><td>${r.status}</td><td>${r.time}</td><td>${r.note}</td></tr>
      `).join("");

      // 4. 貨量 (所有人可看區域概況)
      document.querySelector("#kt-table tbody").innerHTML = volumeKT.map(v => `<tr><td>${v.code}</td><td>${v.name}</td><td>${v.vol}</td></tr>`).join("");
      document.querySelector("#east-table tbody").innerHTML = volumeEast.map(v => `<tr><td>${v.code}</td><td>${v.name}</td><td>${v.vol}</td></tr>`).join("");
    }

    function handleAuthChange() {
      const user = document.getElementById("user-select").value;
      renderView(user);
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    window.onload = () => renderView('admin');
  </script>
</body>
</html>
