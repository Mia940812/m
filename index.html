<html lang="zh-HK">
<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8">

      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-gray-900">📦 派件異常工單與罰款管理系統</h1>
        <p class="text-sm text-gray-500 mt-1">實時工單統計、責任步兵追蹤及入口篩選</p>
      </div>
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800">
          ● 數據已全面同步 (共 <span id="totalTicketsCount" class="font-bold ml-1">0</span> 筆)

      </div>
    </header>

    <!-- 數據概覽卡片 -->

        <div class="text-xs font-semibold text-gray-500 uppercase">總工單數</div>
        <div class="text-2xl font-bold text-gray-900 mt-1" id="statTotal">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <div class="text-xs font-semibold text-green-600 uppercase">已完成處理</div>
        <div class="text-2xl font-bold text-green-600 mt-1" id="statCompleted">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <div class="text-xs font-semibold text-yellow-600 uppercase">處理中 / 待跟進</div>
        <div class="text-2xl font-bold text-yellow-600 mt-1" id="statPending">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">

      { id: 34, date: "8月8日", tracking: "JT0025057380466", entryCode: "05E", address: "觀塘巧明街116號萬年工業大廈6樓A座B3", phone: "93002536", issue: "送錯地址，安排重派並電聯", courier: "觀塘（嘉）-吳瑋儒", result: "處理中", fineText: "-", fineAmount: 0, isDone: false },
      { id: 35, date: "8月8日", tracking: "JT0025062262591", entryCode: "09E", address: "觀塘工業中心二期1樓J5", phone: "95417858", issue: "司機小魚交接後無路由，核實漏派遺落", courier: "司機交接（小魚）", result: "待跟進", fineText: "-", fineAmount: 0, isDone: false },
      { id: 36, date: "8月3日", tracking: "JT0024984596851", entryCode: "11E", address: "麗港城1期2座21樓E室 (重複記錄)", phone: "97818255", issue: "司機徐耀明交接件", courier: "司機交接", result: "清場上報", fineText: "-", fineAmount: 0, isDone: true },
      { id: 37, date: "8月8日", tracking: "JT0025061039326", entryCode: "03E", address: "海濱道181號 One Harbour square 8樓3室", phone: "97285373", issue: "送錯地址，請盡快核實", courier: "觀塘（嘉）-MS 周健", result: "待跟進", fineText: "-", fineAmount: 0, isDone: false }
    ];

    let currentEntry = 'ALL';

    // 初始化頁面
    function init() {
      populateCouriers();
      applyFilters();
    }

    // 填充人員下拉列表
    function populateCouriers() {
      const select = document.getElementById('courierFilter');
      const couriers = [...new Set(rawTickets.map(t => t.courier).filter(Boolean))];
      couriers.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
      });
    }

    // 設定入口過濾（支援 -9, -10, -11 等）
    function setFilter(type, value) {
      if (type === 'entry') {
        currentEntry = value;
        document.querySelectorAll('.entry-btn').forEach(btn => {
          if (btn.getAttribute('data-entry') === value) {
            btn.className = 'entry-btn active px-3 py-1.5 rounded-lg text-sm font-medium bg-blue-600 text-white transition shadow-sm';
          } else {
            btn.className = 'entry-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-gray-100 text-gray-700 hover:bg-gray-200 transition';
          }
        });
        applyFilters();
      }
    }

    // 執行綜合篩選與渲染
    function applyFilters() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const status = document.getElementById('statusFilter').value;
      const courier = document.getElementById('courierFilter').value;

      const filtered = rawTickets.filter(t => {
        // 入口篩選（包含 -9, -10, -11 或 09E, 10E, 11E 等後綴）
        if (currentEntry !== 'ALL') {
          if (currentEntry === '-9' && !(t.entryCode.includes('09') || t.entryCode.includes('9'))) return false;
          if (currentEntry === '-10' && !(t.entryCode.includes('10'))) return false;
          if (currentEntry === '-11' && !(t.entryCode.includes('11'))) return false;
          if (!['-9', '-10', '-11'].includes(currentEntry) && t.entryCode !== currentEntry) return false;
        }

        // 狀態篩選
        if (status === 'COMPLETED' && !t.isDone) return false;
        if (status === 'PENDING' && t.isDone) return false;

        // 責任人篩選
        if (courier !== 'ALL' && t.courier !== courier) return false;

        // 關鍵字搜尋
        if (search) {
          const match = t.tracking.toLowerCase().includes(search) ||
                        t.address.toLowerCase().includes(search) ||
                        t.phone.includes(search) ||
                        t.courier.toLowerCase().includes(search) ||
                        t.issue.toLowerCase().includes(search);
          if (!match) return false;
        }

        return true;
      });

      renderTable(filtered);
      updateStats(filtered);
    }

    // 渲染表格
    function renderTable(tickets) {
      const tbody = document.getElementById('ticketTableBody');
      const noResults = document.getElementById('noResults');
      tbody.innerHTML = '';

      if (tickets.length === 0) {
        noResults.classList.remove('hidden');
        return;
      }
      noResults.classList.add('hidden');

      tickets.forEach(t => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-gray-50 transition border-b border-gray-100';

        tr.innerHTML = `
          <td class="p-3 text-xs text-gray-500 whitespace-nowrap">${t.date}</td>
          <td class="p-3 font-mono text-xs">
            <div class="font-bold text-gray-900">${t.tracking}</div>
            ${t.entryCode ? `<span class="inline-block mt-0.5 px-1.5 py-0.5 rounded bg-blue-50 text-blue-700 text-[11px] font-semibold">${t.entryCode}</span>` : ''}
          </td>
          <td class="p-3 text-xs text-gray-700 max-w-xs break-words">${t.address}</td>
          <td class="p-3 text-xs font-mono text-gray-600">${t.phone}</td>
          <td class="p-3 text-xs text-gray-600 max-w-xs">${t.issue}</td>
          <td class="p-3 text-xs font-medium text-gray-800 whitespace-nowrap">${t.courier || '-'}</td>
          <td class="p-3 text-xs text-gray-600">${t.result || '-'}</td>
          <td class="p-3 text-xs font-semibold ${t.fineAmount > 0 ? 'text-red-600' : 'text-gray-400'}">${t.fineText}</td>
          <td class="p-3 text-center whitespace-nowrap">
            ${t.isDone 
              ? '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">✅ 已完成</span>' 
              : '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-800">⏳ 跟進中</span>'}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 更新面板數據統計
    function updateStats(tickets) {
      document.getElementById('totalTicketsCount').textContent = rawTickets.length;
      document.getElementById('statTotal').textContent = tickets.length;
      document.getElementById('statCompleted').textContent = tickets.filter(t => t.isDone).length;
      document.getElementById('statPending').textContent = tickets.filter(t => !t.isDone).length;

      const totalFines = tickets.reduce((sum, t) => sum + (t.fineAmount || 0), 0);
      document.getElementById('statFines').textContent = `$${totalFines.toFixed(2)} HKD`;
    }

    window.onload = init;
  </script>
</body>
</html>
