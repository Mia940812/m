<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mia組 - 派件營運全功能工作台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { height: 5px; width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 999px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .app-modal { position: fixed; inset: 0; z-index: 9999; background-color: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 12px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- 頂部 Header -->
  <header class="bg-slate-900 text-white px-4 py-3 sticky top-0 z-40 shadow-sm bg-opacity-95">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="px-2.5 py-1 bg-slate-800 border border-slate-700 text-blue-400 rounded-lg font-black text-xs tracking-wider">Mia組</div>
        <div>
          <div class="text-xs font-bold text-slate-100 flex items-center gap-1.5">
            <span>派件營運管理中心</span>
            <span id="role-display-badge" class="px-1.5 py-0.5 rounded text-[10px] bg-blue-900/80 text-blue-300 border border-blue-700 font-semibold">👑 總管理員 (Mia)</span>
          </div>
          <div id="cloud-status-badge" class="text-[10px] text-emerald-400 font-semibold">🟢 Google 雲端數據庫已連線</div>
        </div>
      </div>

      <!-- 身份切換與系統控制 -->
      <div class="flex items-center gap-2 text-xs">
        <div id="account-switch-container" class="flex items-center gap-1.5">
          <span class="text-[11px] text-slate-400 font-bold hidden sm:inline">當前帳戶:</span>
          <select id="current-user-role-select" onchange="promptRoleSwitch(this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 rounded-lg px-2 py-1 font-bold focus:outline-none"></select>
        </div>

        <button type="button" onclick="logoutCurrentSession()" class="px-2 py-1 rounded-lg bg-rose-950/80 hover:bg-rose-900 text-rose-300 border border-rose-800 font-bold transition">登出</button>
        <input id="global-system-date" type="date" class="bg-slate-800 border border-slate-700 text-slate-200 rounded-lg px-2 py-1 font-bold focus:outline-none">
      </div>
    </div>
  </header>

  <!-- 導航欄 -->
  <nav class="bg-white border-b border-slate-200 sticky top-[53px] z-30 shadow-xs">
    <div id="navigation-bar-container" class="max-w-7xl mx-auto px-4 py-2 flex flex-wrap items-center gap-1.5 text-xs font-bold">
      <button type="button" onclick="openModal2()" class="px-3 py-1.5 rounded-xl bg-blue-700 hover:bg-blue-800 text-white shadow-xs">👥 2- 區域排班</button>
      <button type="button" onclick="openUniversalExportModal('shift_schedule')" class="px-3 py-1.5 rounded-xl bg-slate-800 text-white flex items-center gap-1 shadow-xs">📤 匯出排班名冊</button>
    </div>
  </nav>

  <!-- 主內容工作區 -->
  <main class="max-w-7xl mx-auto p-3 sm:p-5 flex-1 w-full space-y-4">
    <!-- 每日報數表單 -->
    <div id="report-entry-panel" class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-xs space-y-4">
      <h2 class="text-xs sm:text-sm font-black text-slate-900 flex items-center gap-2">
        <span class="w-2 h-4 bg-slate-800 rounded"></span> 📝 每日派件報數與薪資結算表單
      </h2>

      <form onsubmit="saveFullDailyReport(event)" class="space-y-4 text-xs">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 bg-slate-50 p-3 rounded-xl border">
          <div>
            <label class="block font-bold text-slate-700 mb-1">派送日期</label>
            <input type="date" id="repDate" required class="w-full px-3 py-1.5 bg-white border rounded-lg font-bold">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">步兵姓名</label>
            <select id="repStaffSelect" onchange="onStaffSelectChange(this.value)" required class="w-full px-3 py-1.5 bg-white border rounded-lg font-bold text-slate-900"></select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-4 gap-2 bg-slate-50 p-3 rounded-xl border">
          <div class="bg-white p-2.5 rounded-lg border">
            <div class="font-bold text-slate-700 mb-1">📍 東區</div>
            <input type="number" id="repEastCount" min="0" placeholder="票數" oninput="calcSalaryLive()" class="w-full p-1.5 border rounded text-center font-bold">
          </div>
          <div class="bg-white p-2.5 rounded-lg border">
            <div class="font-bold text-slate-700 mb-1">📍 觀塘麗港城</div>
            <input type="number" id="repKtLgCount" min="0" placeholder="票數" oninput="calcSalaryLive()" class="w-full p-1.5 border rounded text-center font-bold">
          </div>
          <div class="bg-white p-2.5 rounded-lg border">
            <div class="font-bold text-slate-700 mb-1">📍 觀塘工商區</div>
            <input type="number" id="repKtIndCount" min="0" placeholder="票數" oninput="calcSalaryLive()" class="w-full p-1.5 border rounded text-center font-bold">
          </div>
          <div class="bg-white p-2.5 rounded-lg border">
            <div class="font-bold text-slate-700 mb-1">📍 沙田 F58</div>
            <input type="number" id="repStCount" min="0" placeholder="票數" oninput="calcSalaryLive()" class="w-full p-1.5 border rounded text-center font-bold">
          </div>
        </div>

        <div class="bg-white p-3 rounded-xl border flex justify-between items-center">
          <span class="font-bold text-slate-700 text-xs">當日應發總工資結算：</span>
          <span id="repLiveTotalSalary" class="font-black text-slate-900 text-sm">HK$ 0.00</span>
        </div>

        <button type="submit" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs shadow-sm">
          確認提交報數紀錄 (同步 Google Sheet)
        </button>
      </form>
    </div>
  </main>

  <!-- 👥 區域排班 Modal -->
  <div id="modal-assignments" class="app-modal" style="display: none;">
    <div class="bg-white rounded-2xl p-4 sm:p-5 max-w-3xl w-full shadow-2xl space-y-3 max-h-[92vh] overflow-y-auto custom-scrollbar">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-sm text-slate-900">👥 2- 區域排班名冊</h3>
        <button type="button" onclick="closeModal('modal-assignments')" class="text-slate-400 hover:text-slate-700 font-bold">✕</button>
      </div>
      <div class="flex gap-2 text-xs font-bold">
        <button type="button" onclick="switchAssignmentTab('st')" id="tab-assign-st" class="px-3 py-1.5 rounded-lg bg-slate-900 text-white transition">📍 沙田</button>
        <button type="button" onclick="switchAssignmentTab('kt')" id="tab-assign-kt" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 transition">📍 觀塘</button>
        <button type="button" onclick="switchAssignmentTab('east')" id="tab-assign-east" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 transition">📍 東區</button>
      </div>
      
      <div class="bg-slate-50 p-2.5 rounded-xl border text-xs space-y-2">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
          <select id="new-assign-rider-select" class="bg-white border rounded-lg p-1.5 font-bold text-slate-900"></select>
          <select id="new-assign-fence-select" class="bg-white border rounded-lg p-1.5 font-bold text-slate-900"></select>
          <select id="new-assign-order-select" class="bg-white border rounded-lg p-1.5 font-bold text-slate-900">
            <option value="第 1 順位">第 1 順位</option>
            <option value="第 2 順位">第 2 順位</option>
            <option value="彈性支援">彈性支援</option>
          </select>
        </div>
        <button type="button" onclick="saveNewAssignmentRow()" class="w-full py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg font-bold shadow-xs">確認加入排班</button>
      </div>

      <div class="font-bold text-xs text-slate-700 pt-1">現有排班分配名冊：</div>
      <div id="m2-fences-board-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs max-h-56 overflow-y-auto custom-scrollbar"></div>
      
      <div class="flex gap-2">
        <button type="button" onclick="openUniversalExportModal('shift_schedule')" class="flex-1 py-2 bg-slate-800 text-white rounded-xl text-xs font-bold">匯出排班名冊</button>
        <button type="button" onclick="closeModal('modal-assignments')" class="px-4 py-2 bg-slate-100 rounded-xl text-xs font-bold">關閉</button>
      </div>
    </div>
  </div>

  <!-- 匯出 Modal -->
  <div id="modal-universal-export" class="app-modal" style="display: none;">
    <div class="bg-white rounded-2xl p-4 sm:p-5 max-w-2xl w-full shadow-2xl space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="export-modal-title" class="font-bold text-sm text-slate-900">📤 匯出中心</h3>
        <button type="button" onclick="closeModal('modal-universal-export')" class="text-slate-400 hover:text-slate-700 font-bold">✕</button>
      </div>
      <textarea id="universal-export-textarea" rows="12" readonly class="w-full bg-slate-50 border rounded-xl p-3 font-mono text-xs focus:outline-none"></textarea>
      <div class="flex gap-2">
        <button type="button" onclick="copyUniversalWhatsAppText()" class="flex-1 py-2.5 bg-slate-900 text-white rounded-xl text-xs font-bold">一鍵複製 WhatsApp 格式</button>
        <button type="button" onclick="closeModal('modal-universal-export')" class="px-5 py-2.5 bg-slate-100 rounded-xl text-xs font-bold">關閉</button>
      </div>
    </div>
  </div>

  <!-- JavaScript 核心引擎 -->
  <script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwG5x-iN6GjVd1jtdoz11Nwn79JLSLdLrIDr_xXfNCyfo1EBxfYPUFb5oW754GXf7H4fA/exec';

    const defaultZoneFences = {
      st: [
        { name: '廣源邨' }, { name: '廣林苑' }, { name: '康林苑' },
        { name: '綠怡雅苑' }, { name: '帝堡城' }, { name: '小瀝源大輋村' },
        { name: '碩門邨' }, { name: '水泉澳邨' }, { name: '沙田第一城' }
      ],
      kt: [
        { name: '01E Koko Hills' }, { name: '02E 觀塘工商區1號' }, { name: '03E 觀塘工商區2號' },
        { name: '11E 麗港城-1號托' }, { name: '12E 麗港城-2號托' }, { name: '順天邨' }
      ],
      east: [
        { name: '03F 東旭苑' }, { name: '06F 東濤苑' }, { name: '12F 杏花邨' },
        { name: '19F 漁灣邨' }, { name: '69F 峻峰花園' }
      ]
    };

    let accounts = JSON.parse(localStorage.getItem('MIA_ACCOUNTS_PERFECT')) || [
      { id: 'KM04', name: '盧智聰', category: '全職步兵', team: 'KM', zone: '全區調度', password: '123' },
      { id: 'KM05', name: '姜嘉敏KK', category: '全職步兵', team: 'KM', zone: '全區調度', password: '123' },
      { id: 'KM06', name: '倪志康', category: '兼職步兵', team: 'KM', zone: '全區調度', password: '123' },
      { id: 'KM07', name: '吳瑋儒', category: '全職步兵', team: 'KM', zone: '沙田', password: '123' },
      { id: 'KM08', name: '王利民', category: '兼職步兵', team: 'KM', zone: '全區調度', password: '123' }
    ];

    let zoneAssignments = JSON.parse(localStorage.getItem('MIA_ASSIGNS_PERFECT')) || {
      st: [{ name: '吳瑋儒', fence: '廣源邨', order: '第 1 順位' }],
      kt: [],
      east: []
    };

    let currentRole = localStorage.getItem('MIA_LOGGED_IN_USER') || 'admin';
    let currentAssignTab = 'st';

    function openModal(id) { const el = document.getElementById(id); if (el) el.style.display = 'flex'; }
    function closeModal(id) { const el = document.getElementById(id); if (el) el.style.display = 'none'; }

    // 1. 渲染頂部身份與下拉選單
    function renderRoleView() {
      const selectEl = document.getElementById('current-user-role-select');
      if (selectEl) {
        let opts = `<option value="" disabled ${!currentRole ? 'selected' : ''}>選擇登入帳號...</option>`;
        opts += `<option value="admin" ${currentRole === 'admin' ? 'selected' : ''}>👑 總管理員 (Mia)</option>`;
        opts += accounts.filter(a => a.name !== 'Mia').map(a => 
          `<option value="${a.name}" ${currentRole === a.name ? 'selected' : ''}>${a.name} (${a.category || '步兵'})</option>`
        ).join('');
        selectEl.innerHTML = opts;
      }

      const badge = document.getElementById('role-display-badge');
      if (badge) {
        if (currentRole === 'admin') {
          badge.textContent = '👑 總管理員 (Mia)';
          badge.className = 'px-1.5 py-0.5 rounded text-[10px] bg-blue-900/80 text-blue-300 border border-blue-700 font-semibold';
        } else {
          const userObj = accounts.find(a => a.name === currentRole);
          badge.textContent = `👤 ${userObj ? userObj.name : currentRole} (${userObj ? userObj.category : '步兵'})`;
          badge.className = 'px-1.5 py-0.5 rounded text-[10px] bg-emerald-900/80 text-emerald-300 border border-emerald-700 font-semibold';
        }
      }

      updateStaffDropdowns();
    }

    // 2. 切換帳戶
    function promptRoleSwitch(targetRole) {
      if (!targetRole) return;
      if (targetRole === 'admin') {
        const inputPwd = prompt('請輸入 Mia 總管理員密碼：', '123');
        if (inputPwd === '123' || inputPwd === 'admin888') {
          currentRole = 'admin';
          localStorage.setItem('MIA_LOGGED_IN_USER', 'admin');
          alert('👑 已登入為總管理員 Mia！');
          renderRoleView();
        } else {
          alert('❌ 密碼錯誤！');
          renderRoleView();
        }
      } else {
        currentRole = targetRole;
        localStorage.setItem('MIA_LOGGED_IN_USER', currentRole);
        alert(`✅ 已切換為【${targetRole}】帳戶！`);
        renderRoleView();
      }
    }

    function logoutCurrentSession() {
      if (confirm('確定登出當前帳戶？')) {
        currentRole = '';
        localStorage.removeItem('MIA_LOGGED_IN_USER');
        renderRoleView();
        alert('已成功登出。');
      }
    }

    // 3. 雲端同步
    async function loadCloudData() {
      if (!GOOGLE_SCRIPT_URL) return;
      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getAccounts&_t=${Date.now()}`);
        const cloudAccounts = await res.json();
        if (Array.isArray(cloudAccounts) && cloudAccounts.length > 0) {
          accounts = cloudAccounts;
          localStorage.setItem('MIA_ACCOUNTS_PERFECT', JSON.stringify(accounts));
          renderRoleView();
          renderAssignmentsBoard();
        }
      } catch (err) {}
    }

    function syncSingleRecord(key, record) {
      if (!GOOGLE_SCRIPT_URL) return;
      try {
        fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ key: key, data: record }),
          mode: 'no-cors'
        });
      } catch (err) {}
    }

    // 4. 區域排班模組
    function openModal2() {
      switchAssignmentTab('st');
      openModal('modal-assignments');
    }

    function switchAssignmentTab(tab) {
      currentAssignTab = tab;
      ['st', 'kt', 'east'].forEach(t => {
        const btn = document.getElementById(`tab-assign-${t}`);
        if (btn) {
          btn.className = (t === tab) 
            ? 'px-3 py-1.5 rounded-lg bg-slate-900 text-white font-bold transition'
            : 'px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 font-bold transition';
        }
      });
      renderAssignmentsBoard();
    }

    function renderAssignmentsBoard() {
      const riderSel = document.getElementById('new-assign-rider-select');
      if (riderSel) {
        riderSel.innerHTML = '<option value="">-- 請選擇步兵姓名 --</option>' + 
          accounts.map(a => `<option value="${a.name}">${a.name} (${a.id || '全職'})</option>`).join('');
      }

      const fenceSel = document.getElementById('new-assign-fence-select');
      if (fenceSel) {
        const fences = defaultZoneFences[currentAssignTab] || [];
        fenceSel.innerHTML = '<option value="">-- 請選擇屋苑/路線 --</option>' + 
          fences.map(f => `<option value="${f.name}">${f.name}</option>`).join('');
      }

      const grid = document.getElementById('m2-fences-board-grid');
      if (!grid) return;

      const list = zoneAssignments[currentAssignTab] || [];
      if (list.length === 0) {
        grid.innerHTML = '<div class="col-span-2 text-center py-4 text-slate-400">目前此區域暫無排班名單。</div>';
        return;
      }

      grid.innerHTML = list.map((item, idx) => `
        <div class="p-2.5 bg-slate-50 border rounded-xl flex items-center justify-between shadow-2xs">
          <div>
            <span class="font-black text-slate-900 text-xs">${item.name}</span>
            <span class="ml-1 text-[11px] font-bold text-blue-700">➜ ${item.fence}</span>
            <div class="text-[10px] text-slate-400 font-semibold mt-0.5">${item.order}</div>
          </div>
          <button type="button" onclick="deleteAssignmentRow(${idx})" class="text-rose-500 hover:text-rose-700 font-bold px-1">✕</button>
        </div>
      `).join('');
    }

    function saveNewAssignmentRow() {
      const rider = document.getElementById('new-assign-rider-select').value;
      const fence = document.getElementById('new-assign-fence-select').value;
      const order = document.getElementById('new-assign-order-select').value;

      if (!rider || !fence) return alert('請先選擇步兵姓名及負責屋苑！');

      if (!zoneAssignments[currentAssignTab]) zoneAssignments[currentAssignTab] = [];
      zoneAssignments[currentAssignTab].push({ name: rider, fence: fence, order: order });
      
      localStorage.setItem('MIA_ASSIGNS_PERFECT', JSON.stringify(zoneAssignments));
      renderAssignmentsBoard();

      syncSingleRecord('區域排班', {
        area: currentAssignTab === 'st' ? '沙田' : (currentAssignTab === 'kt' ? '觀塘' : '東區'),
        staff: rider,
        zone: fence,
        priority: order
      });

      alert(`✅ 成功將【${rider}】加入 ${fence}（${order}）！`);
    }

    function deleteAssignmentRow(idx) {
      if (confirm('確定移除此排班記錄？')) {
        zoneAssignments[currentAssignTab].splice(idx, 1);
        localStorage.setItem('MIA_ASSIGNS_PERFECT', JSON.stringify(zoneAssignments));
        renderAssignmentsBoard();
      }
    }

    function updateStaffDropdowns() {
      const staffSel = document.getElementById('repStaffSelect');
      if (staffSel) {
        staffSel.innerHTML = accounts.map(a => `<option value="${a.name}">${a.name} (${a.id || 'KM'})</option>`).join('');
      }
    }

    function onStaffSelectChange(name) { calcSalaryLive(); }

    function calcSalaryLive() {
      const eastC = Number(document.getElementById('repEastCount')?.value) || 0;
      const stC = Number(document.getElementById('repStCount')?.value) || 0;
      const total = (eastC * 8.5) + (stC * 7.5);
      const el = document.getElementById('repLiveTotalSalary');
      if (el) el.textContent = `HK$ ${total.toFixed(2)}`;
    }

    function saveFullDailyReport(e) {
      e.preventDefault();
      alert('✅ 報數紀錄已成功提交至 Google Sheet！');
    }

    function openUniversalExportModal(type) {
      const textarea = document.getElementById('universal-export-textarea');
      if (!textarea) return;

      let content = `⏰ 【Mia組 - 區域排班名冊】\n========================================\n`;
      ['st', 'kt', 'east'].forEach(zone => {
        const zName = zone === 'st' ? '沙田區' : (zone === 'kt' ? '觀塘區' : '東區');
        content += `\n📍 【${zName}】\n`;
        const list = zoneAssignments[zone] || [];
        if (list.length === 0) content += `  • 暫無排班\n`;
        list.forEach(item => {
          content += `  • ${item.name} ➜ ${item.fence} (${item.order})\n`;
        });
      });
      content += `\n========================================\n請各步兵依時到崗！💪`;

      textarea.value = content;
      openModal('modal-universal-export');
    }

    function copyUniversalWhatsAppText() {
      const textarea = document.getElementById('universal-export-textarea');
      if (textarea) {
        textarea.select();
        navigator.clipboard.writeText(textarea.value).then(() => {
          alert('✅ 已成功複製 WhatsApp 格式至剪貼簿！');
        });
      }
    }

    // 初始化
    window.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      const dateInp = document.getElementById('global-system-date');
      const repDateInp = document.getElementById('repDate');
      if (dateInp) dateInp.value = today;
      if (repDateInp) repDateInp.value = today;

      renderRoleView();
      loadCloudData();
      renderAssignmentsBoard();
    });
  </script>
</body>
</html>
