<!-- 獨立登入頁面 (未登入時顯示) -->
<div id="loginSection" style="display: block; max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; text-align: center;">
  <h2>🔐 步兵/管理員 系統登入</h2>
  <div style="margin-bottom: 15px;">
    <input type="text" id="loginId" placeholder="請輸入帳號 ID (例如: KM04, Mia)" style="width: 100%; padding: 10px; box-sizing: border-box;">
  </div>
  <div style="margin-bottom: 15px;">
    <input type="password" id="loginPassword" placeholder="請輸入密碼" style="width: 100%; padding: 10px; box-sizing: border-box;">
  </div>
  <button onclick="handleLogin()" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">確認登入</button>
  <p id="loginError" style="color: red; display: none; margin-top: 10px;">帳號或密碼錯誤！</p>
</div>

<!-- 主系統頁面 (登入後顯示) -->
<div id="mainSection" style="display: none;">
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #f8f9fa;">
    <!-- 顯示目前登入者，但不提供自由下拉切換 -->
    <div>
      當前登入者：<span id="currentUserDisplay" style="font-weight: bold;"></span>
    </div>
    <button onclick="handleLogout()" style="padding: 5px 15px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">🚪 安全登出</button>
  </header>

  <!-- 你的主系統內容模組 (1-圍欄管理, 8-車線調度, 埋數系統等) -->
  <div id="appContent">
    <!-- 原本的各個功能模組放置處 -->
  </div>
</div>
