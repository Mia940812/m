<!-- 導航列按鈕 (請放置在原有導航按鈕旁) -->
<button class="nav-btn" onclick="switchTab('salary-tab')">💵 步兵出糧紀錄</button>

<!-- 出糧紀錄 Tab 主體 -->
<div id="salary-tab" class="tab-content" style="display: none; padding: 15px;">
  <div style="background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <h3 style="margin-top: 0; color: #333;">💵 步兵獨立出糧與轉賬紀錄</h3>
    
    <!-- 篩選與新增控制區 -->
    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; align-items: center; background: #f8f9fa; padding: 12px; border-radius: 6px;">
      <div>
        <label style="font-weight: bold; display: block; font-size: 12px;">選擇步兵：</label>
        <select id="salary-staff-select" onchange="renderSalaryTable()" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; width: 140px;">
          <!-- 動態載入步兵選單 -->
        </select>
      </div>

      <div>
        <label style="font-weight: bold; display: block; font-size: 12px;">出糧日期：</label>
        <input type="date" id="salary-inp-date" style="padding: 5px; border-radius: 4px; border: 1px solid #ccc;">
      </div>

      <div>
        <label style="font-weight: bold; display: block; font-size: 12px;">當日工資 (HK$)：</label>
        <input type="number" id="salary-inp-amount" placeholder="0.00" style="padding: 5px; border-radius: 4px; border: 1px solid #ccc; width: 110px;">
      </div>

      <div>
        <label style="font-weight: bold; display: block; font-size: 12px;">出糧方式：</label>
        <select id="salary-inp-method" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
          <option value="轉數快">轉數快 (FPS)</option>
          <option value="支付寶">支付寶 (Alipay)</option>
          <option value="銀行轉賬">銀行轉賬</option>
          <option value="現金">現金</option>
        </select>
      </div>

      <div style="align-self: flex-end;">
        <button onclick="addSalaryRecord()" style="background: #28a745; color: white; border: none; padding: 7px 15px; border-radius: 4px; cursor: pointer;">➕ 新增紀錄</button>
        <button onclick="exportSalaryWhatsApp()" style="background: #25D366; color: white; border: none; padding: 7px 15px; border-radius: 4px; cursor: pointer; margin-left: 5px;">📱 匯出 WhatsApp</button>
      </div>
    </div>

    <!-- 統計卡片 -->
    <div style="display: flex; gap: 15px; margin-bottom: 15px;">
      <div style="flex: 1; background: #e3f2fd; padding: 10px; border-radius: 6px;">
        <span style="font-size: 12px; color: #555;">當前步兵總應發工資:</span>
        <div id="salary-total-amount" style="font-size: 18px; font-weight: bold; color: #0d47a1;">HK$ 0.00</div>
      </div>
      <div style="flex: 1; background: #e8f5e9; padding: 10px; border-radius: 6px;">
        <span style="font-size: 12px; color: #555;">已轉賬簽收總額:</span>
        <div id="salary-paid-amount" style="font-size: 18px; font-weight: bold; color: #2e7d32;">HK$ 0.00</div>
      </div>
      <div style="flex: 1; background: #ffebee; padding: 10px; border-radius: 6px;">
        <span style="font-size: 12px; color: #555;">未轉賬待結總額:</span>
        <div id="salary-unpaid-amount" style="font-size: 18px; font-weight: bold; color: #c62828;">HK$ 0.00</div>
      </div>
    </div>

    <!-- 出糧表格 -->
    <div style="overflow-x: auto;">
      <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
        <thead>
          <tr style="background: #f1f3f5; border-bottom: 2px solid #dee2e6;">
            <th style="padding: 10px;">出糧日期</th>
            <th style="padding: 10px;">步兵名字</th>
            <th style="padding: 10px;">當日工資 (HK$)</th>
            <th style="padding: 10px;">支付方式</th>
            <th style="padding: 10px; text-align: center;">已轉賬 (打剔)</th>
            <th style="padding: 10px; text-align: center;">操作</th>
          </tr>
        </thead>
        <tbody id="salary-table-body">
          <!-- 資料動態渲染 -->
        </tbody>
      </table>
    </div>
  </div>
</div>
