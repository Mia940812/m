<!-- 1. 登入頁面 -->
<div id="loginSection" style="display: block; max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; text-align: center;">
  <h2>🔐 步兵/管理員 系統登入</h2>
  <input type="text" id="loginId" placeholder="帳號 (例如: Mia, KM01)">
  <input type="password" id="loginPassword" placeholder="密碼">
  <button onclick="handleLogin()">確認登入</button>
</div>

<!-- 2. 主系統頁面 (把你原本所有的 HTML 模組放到這裡面) -->
<div id="mainSection" style="display: none;">
  
  <!-- 頂部登入者資訊列 -->
  <div style="display: flex; justify-content: space-between; padding: 10px; background: #eee;">
    <span>當前登入者：<strong id="currentUserDisplay">--</strong></span>
    <button onclick="handleLogout()">🚪 登出</button>
  </div>

  <!-- ⚠️⚠️⚠️ 關鍵：把你原本系統的所有 HTML 代碼（圍欄、埋數、車線等）全部貼在下面 ⚠️⚠️⚠️ -->
  
  <!-- 例如：-->
  <!-- <div id="fenceSection">...</div> -->
  <!-- <div id="financeSection">...</div> -->
  <!-- ...原本的所有模組... -->

</div>
