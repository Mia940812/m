<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>派件營運中心管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-7xl mx-auto p-4">
    <!-- 頂部導航與登入列 -->
    <header class="flex flex-wrap justify-between items-center gap-4 bg-slate-900 border border-slate-800 p-4 rounded-xl mb-6 shadow-lg">
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
          📦 派件營運中心
        </h1>
        <input type="date" id="global-system-date" class="bg-slate-800 text-xs text-slate-200 px-2.5 py-1.5 rounded border border-slate-700 focus:outline-none focus:border-blue-500" />
      </div>

      <!-- 頂部身分登入區塊 (改為文字輸入帳號) -->
      <div class="flex items-center gap-2 bg-slate-800/80 p-2 rounded-lg border border-slate-700">
        <span class="text-xs text-slate-300 font-medium">身分:</span>
        <span id="role-display-badge" class="px-1.5 py-0.5 rounded text-[10px] bg-blue-900/85 text-blue-300 border border-blue-700 font-semibold">👑 總管理員 (Mia)</span>
        
        <!-- 輸入帳號欄位 -->
        <input type="text" id="login-username-input" placeholder="輸入帳號或名稱..." class="bg-slate-900 text-white text-xs px-2 py-1 rounded border border-slate-600 focus:outline-none focus:border-blue-500 w-28" />
        
        <button type="button" onclick="handleAccountLogin()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-2.5 py-1 rounded font-medium transition-colors">
          切換/登入
        </button>
      </div>
    </header>

    <!-- 主內容區塊範例 -->
    <main class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <h2 class="text-sm font-bold text-blue-400 mb-2">📊 營運捷徑</h2>
        <div class="flex flex-col gap-2">
          <button onclick="openModal1()" class="bg-slate-800 hover:bg-slate-700 text-xs py-2 px-3 rounded text-left transition-colors">🗺️ 圍欄與區域設定</button>
          <button onclick="openModal2()" class="bg-slate-800 hover:bg-slate-700 text-xs py-2 px-3 rounded text-left transition-colors">📋 派件任務指派</button>
          <button onclick="openSuppliesModal()" class="bg-slate-800 hover:bg-slate-700 text-xs py-2 px-3 rounded text-left transition-colors">🛠️ 物資與裝備管理</button>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl md:col-span-2">
        <h2 class="text-sm font-bold text-emerald-400 mb-2">⚡ 違規罰款與龍虎榜獎池</h2>
        <div class="flex flex-wrap gap-2 mb-3">
          <input type="date" id="lb-inp-date" class="bg-slate-800 text-xs text-slate-200 px-2 py-1 rounded border border-slate-700" />
          <input type="text" id="lb-inp-staff" placeholder="人員姓名" class="bg-slate-800 text-xs text-slate-200 px-2 py-1 rounded border border-slate-700 w-24" />
          <input type="number" id="lb-inp-amount" placeholder="罰款金額" class="bg-slate-800 text-xs text-slate-200 px-2 py-1 rounded border border-slate-700 w-24" />
          <input type="text" id="lb-inp-reason" placeholder="違規原因" class="bg-slate-800 text-xs text-slate-200 px-2 py-1 rounded border border-slate-700 flex-1 min-w-[120px]" />
          <button onclick="saveNewPenaltyRecord()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1 rounded font-medium">錄入罰款</button>
        </div>
        <div id="penalty-list-container" class="space-y-1 text-xs text-slate-300 max-h-40 overflow-y-auto">
          <!-- 動態渲染罰款記錄 -->
        </div>
      </div>
    </main>
  </div>

  <!-- 簡易通用 Modal 範例 -->
  <div id="modal-universal-export" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 max-w-md w-full">
      <h3 id="export-modal-title" class="text-sm font-bold text-white mb-2">匯出中心</h3>
      <textarea id="universal-export-textarea" class="w-full h-32 bg-slate-950 text-slate-200 text-xs p-2 rounded border border-slate-700 mb-3"></textarea>
      <div class="flex justify-end gap-2">
        <button onclick="copyUniversalWhatsAppText()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded">複製內容</button>
        <button onclick="closeModal('modal-universal-export')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded">關閉</button>
      </div>
    </div>
  </div>

  <script>
    // 預設資料與狀態變數
    let currentRole = localStorage.getItem('currentRole') || 'admin';
    let accounts = JSON.parse(localStorage.getItem('accounts')) || [
      { id: '001', name: '陳小明', category: '步兵', team: 'A組' },
      { id: '002', name: '李大華', category: '步兵', team: 'B組' }
    ];
    let penaltyList = JSON.parse(localStorage.getItem('penaltyList')) || [];
    let dailyReports = JSON.parse(localStorage.getItem('dailyReports')) || [];

    function saveData() {
      localStorage.setItem('currentRole', currentRole);
      localStorage.setItem('accounts', JSON.stringify(accounts));
      localStorage.setItem('penaltyList', JSON.stringify(penaltyList));
      localStorage.setItem('dailyReports', JSON.stringify(dailyReports));
    }

    // 執行帳號登入/切換
    function handleAccountLogin() {
      const inputVal = document.getElementById('login-username-input').value.trim();
      
      if (!inputVal || inputVal === 'Mia' || inputVal.toLowerCase() === 'admin') {
        currentRole = 'admin';
        saveData();
        renderRoleView();
        alert('👑 已成功切換為總管理員 (Mia) 視圖！');
        return;
      }

      // 比對帳號名稱或員工編號 (id)
      const foundUser = accounts.find(a => a.name === inputVal || a.id === inputVal);
      
      if (foundUser) {
        currentRole = foundUser.name;
        saveData();
        renderRoleView();
        alert(`✅ 歡迎登入，${foundUser.name} (${foundUser.category})！`);
      } else {
        alert(`❌ 找不到此帳號：「${inputVal}」。請確認名稱或編號是否正確，或先由總管理員新增該人員。`);
      }
    }

    // 渲染角色視圖與更新輸入框預設值
    function renderRoleView() {
      const inputEl = document.getElementById('login-username-input');
      if (inputEl) {
        inputEl.value = currentRole === 'admin' ? '' : currentRole;
      }

      const roleBadge = document.getElementById('role-display-badge');
      if (roleBadge) {
        if (currentRole === 'admin' || !currentRole) {
          roleBadge.textContent = '👑 總管理員 (Mia)';
          roleBadge.className = 'px-1.5 py-0.5 rounded text-[10px] bg-blue-900/80 text-blue-300 border border-blue-700 font-semibold';
        } else {
          const user = accounts.find(a => a.name === currentRole);
          roleBadge.textContent = user ? `👤 ${user.name} (${user.category})` : `👤 ${currentRole}`;
          roleBadge.className = 'px-1.5 py-0.5 rounded text-[10px] bg-emerald-900/80 text-emerald-300 border border-emerald-700 font-semibold';
        }
      }

      renderLeaderboardData();
    }

    function renderLeaderboardData() {
      const container = document.getElementById('penalty-list-container');
      if (!container) return;
      if (penaltyList.length === 0) {
        container.innerHTML = `<div class="text-slate-500 text-center py-2">目前尚無罰款記錄</div>`;
        return;
      }
      container.innerHTML = penaltyList.map((p, idx) => `
        <div class="flex justify-between items-center bg-slate-950/60 p-2 rounded border border-slate-800">
          <div><span class="text-slate-400">[${p.date}]</span> <strong class="text-white">${p.staff}</strong> 違反: ${p.reason} <span class="text-emerald-400 font-bold">-$${p.amount}</span></div>
          ${currentRole === 'admin' ? `<button onclick="deletePenaltyRecord(${idx})" class="text-rose-400 hover:text-rose-300 text-[10px] px-1.5 py-0.5 bg-rose-950/50 rounded border border-rose-800">刪除</button>` : ''}
        </div>
      `).join('');
    }

    function saveNewPenaltyRecord() {
      if (currentRole !== 'admin') {
        alert('❌ 權限不足：只有總管理員 Mia 有權錄入違規罰款！');
        return;
      }
      const date = document.getElementById('lb-inp-date').value;
      const staff = document.getElementById('lb-inp-staff').value.trim();
      const amount = Number(document.getElementById('lb-inp-amount').value);
      const reason = document.getElementById('lb-inp-reason').value.trim();

      if (!date || !staff || !amount || !reason) {
        alert('請完整填寫日期、人員、罰款金額及違規原因！');
        return;
      }

      penaltyList.unshift({ id: 'PN' + Date.now().toString().slice(-4), date, staff, amount, reason });
      saveData();
      renderLeaderboardData();
      document.getElementById('lb-inp-amount').value = '';
      document.getElementById('lb-inp-reason').value = '';
      alert('✅ 違規罰款已成功錄入！');
    }

    function deletePenaltyRecord(idx) {
      if (currentRole !== 'admin') return alert('權限不足！');
      if (confirm('確定刪除此條記錄？')) {
        penaltyList.splice(idx, 1);
        saveData();
        renderLeaderboardData();
      }
    }

    function openModal(modalId) {
      const el = document.getElementById(modalId);
      if (el) el.classList.remove('hidden');
    }

    function closeModal(modalId) {
      const el = document.getElementById(modalId);
      if (el) el.classList.add('hidden');
    }

    function copyUniversalWhatsAppText() {
      const ta = document.getElementById('universal-export-textarea');
      ta.select();
      document.execCommand('copy');
      alert('✅ 已成功複製到剪貼簿！');
    }

    function openSuppliesModal() { alert('開啟物資模組'); }
    function openModal1() { alert('開啟圍欄設定模組'); }
    function openModal2() { alert('開啟派件任務指派模組'); }

    window.addEventListener('DOMContentLoaded', () => {
      const todayStr = new Date().toISOString().split('T')[0];
      const dateInp = document.getElementById('global-system-date');
      if (dateInp) dateInp.value = todayStr;
      const lbDate = document.getElementById('lb-inp-date');
      if (lbDate) lbDate.value = todayStr;

      renderRoleView();
    });
  </script>
</body>
</html>
