<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mia Group 派送營運工作台</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #e74c3c;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 15px;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
    }
    .btn-danger { background: var(--accent-color); }
    .btn-success { background: #27ae60; }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .modal {
      display: flex;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
    }
    .hidden { display: none !important; }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .badge {
      background: #e17055;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 頁面頂部資訊 -->
  <div class="card header-bar">
    <div>
      <h2 style="margin:0;">🚚 Mia Group 營運系統</h2>
      <small id="user-display-status">目前身分：未登入</small>
    </div>
    <button class="btn btn-danger" style="width: auto;" onclick="logout()">登出帳號</button>
  </div>

  <!-- 主控台版面 (預設隱藏) -->
  <div id="main-dashboard" class="hidden">
    <div class="card">
      <h3>📋 營運日報表 & 違規紀錄</h3>
      <p>歡迎登入系統，請選擇相應的操作功能。</p>
      
      <!-- 管理員 Mia 專用區塊 -->
      <div id="admin-only-tools" class="hidden">
        <span class="badge">Admin 權限</span>
        <p style="color: #27ae60; font-weight: bold;">登入者：總管理員 (Mia)</p>
        <button class="btn btn-success" onclick="exportLeaderboardWhatsApp()">📤 匯出 WhatsApp 違規龍虎榜</button>
      </div>

      <!-- 步兵 / 司機 專用區塊 -->
      <div id="staff-only-tools" class="hidden">
        <span class="badge" style="background:#0984e3;">步兵 / 司機權限</span>
        <p>請在此填寫每日派送與打卡紀錄。</p>
      </div>
    </div>
  </div>
</div>

<!-- 強制帳號登入 Modal 彈窗 (預設顯示) -->
<div id="login-modal" class="modal">
  <div class="modal-content">
    <h3 style="margin-top:0;">🔐 請先登入帳號</h3>
    <p style="font-size: 13px; color: #666;">進入系統前請先驗證身份：</p>
    
    <label>帳號：</label>
    <input type="text" id="login-username" placeholder="請輸入帳號 (例如: rider01)">
    
    <label>密碼：</label>
    <input type="password" id="login-password" placeholder="請輸入密碼">
    
    <button class="btn" onclick="processLogin()">登入系統</button>
  </div>
</div>

<script>
  // 1. 安全防禦核心：頁面一讀取，立刻清空任何舊有的登入紀錄
  localStorage.clear();
  sessionStorage.clear();

  let currentUser = null;
  let currentRole = null;

  // 2. 網頁加載完畢，鎖定在登入畫面
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('main-dashboard').classList.add('hidden');
    document.getElementById('login-modal').style.display = 'flex';
  });

  // 3. 處理登入驗證
  function processLogin() {
    const u = document.getElementById('login-username').value.trim();
    const p = document.getElementById('login-password').value.trim();

    if (!u || !p) {
      alert('請輸入帳號與密碼！');
      return;
    }

    // 權限判斷：只有輸入專屬管理員密碼才會給予 Admin 權限
    if (u.toLowerCase() === 'mia' && p === '940812') {
      currentUser = 'Mia';
      currentRole = 'admin';
    } else {
      currentUser = u;
      currentRole = 'staff';
    }

    // 登入成功，關閉登入視窗並渲染對應權限版面
    document.getElementById('login-modal').style.display = 'none';
    showDashboard();
  }

  // 4. 根據身分顯示介面
  function showDashboard() {
    document.getElementById('main-dashboard').classList.remove('hidden');
    document.getElementById('user-display-status').textContent = `目前登入：${currentUser} (${currentRole === 'admin' ? '管理員' : '步兵'})`;

    if (currentRole === 'admin') {
      document.getElementById('admin-only-tools').classList.remove('hidden');
      document.getElementById('staff-only-tools').classList.add('hidden');
    } else {
      document.getElementById('admin-only-tools').classList.add('hidden');
      document.getElementById('staff-only-tools').classList.remove('hidden');
    }
  }

  // 5. 手動登出
  function logout() {
    localStorage.clear();
    sessionStorage.clear();
    alert('已成功登出！');
    location.reload(); // 重新整理頁面，觸發最上方的清空機制
  }

  // 6. 匯出 WhatsApp 範例
  function exportLeaderboardWhatsApp() {
    alert('已匯出 WhatsApp 違規龍虎榜！');
  }
</script>

</body>
</html>
