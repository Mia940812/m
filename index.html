<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mia組 - 派件營運系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 flex flex-col items-center">

  <div class="max-w-xl w-full space-y-4">
    <!-- 頂部卡片 -->
    <div class="bg-slate-900 text-white p-4 rounded-3xl shadow-md flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="px-3 py-1 bg-blue-600 rounded-xl font-black text-sm">Mia組</span>
        <span class="text-xs font-bold text-slate-300">派件直通雲端工作台</span>
      </div>
      <div id="status" class="text-xs text-emerald-400 font-bold">🟢 雲端就緒</div>
    </div>

    <!-- 派件報數表單 -->
    <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
      <h2 class="text-sm font-black text-slate-900 mb-4 flex items-center gap-2">
        <span class="w-2 h-4 bg-blue-600 rounded-full"></span> 提交派件報數 (直通 Google Sheet)
      </h2>
      
      <form onsubmit="handleDirectSubmit(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">派送日期</label>
          <input type="date" id="repDate" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold">
        </div>
        
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">區域</label>
          <select id="repArea" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold">
            <option value="東區 (41圍欄)">📍 東區 (41圍欄)</option>
            <option value="觀塘區">📍 觀塘區</option>
            <option value="沙田區">📍 沙田區</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">司機 / 步兵 / 車線</label>
          <input type="text" id="repStaff" placeholder="例如：Mia / 景鴻 / 03E" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">派件票數 (票)</label>
          <input type="number" id="repCount" min="1" placeholder="輸入件數" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-black text-blue-600">
        </div>

        <button type="submit" id="submitBtn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-black rounded-2xl text-xs shadow-md shadow-blue-600/20 transition">
          🚀 立即寫入 Google Sheet
        </button>
      </form>
    </div>

    <!-- 提示框 -->
    <div id="resultMsg" class="p-3 bg-blue-50 text-blue-800 rounded-2xl text-xs font-bold text-center hidden"></div>
  </div>

  <!-- 隱藏的直通表單 (無阻擋穿透) -->
  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
  <form id="directPostForm" method="POST" action="https://script.google.com/macros/s/AKfycbzGrY1lB4MQMpvbNmgkQnL5MoszDEb-Re5pbAivI4daxtaQlv8s3RZ3IbEcu9eXD89fBw/exec" target="hidden_iframe" style="display:none;">
    <input type="hidden" name="key" id="form_key" value="派件報數">
    <input type="hidden" name="data" id="form_data" value="">
  </form>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('repDate').valueAsDate = new Date();
    });

    function handleDirectSubmit(e) {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('resultMsg');
      
      const payload = {
        date: document.getElementById('repDate').value,
        area: document.getElementById('repArea').value,
        staff: document.getElementById('repStaff').value.trim(),
        count: document.getElementById('repCount').value
      };

      document.getElementById('form_data').value = JSON.stringify(payload);
      
      // 觸發原生表單直通提交（100% 穿透）
      document.getElementById('directPostForm').submit();
      
      btn.innerText = '✅ 正在寫入 Google...';
      btn.disabled = true;
      
      setTimeout(() => {
        msg.classList.remove('hidden');
        msg.innerText = `✅ 成功寫入！${payload.area} - ${payload.staff} (${payload.count}票)`;
        btn.innerText = '🚀 立即寫入 Google Sheet';
        btn.disabled = false;
        document.getElementById('repStaff').value = '';
        document.getElementById('repCount').value = '';
      }, 1200);
    }
  </script>
</body>
</html>
