<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mia組 - 派件營運全功能工作台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans">

  <!-- 🔐 系統登入遮罩 Modal -->
  <div id="modal-system-login" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden border border-slate-100 animate-in fade-in zoom-in duration-200">
      <div class="bg-slate-900 text-white p-6 text-center relative">
        <div class="w-12 h-12 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-xl font-black mb-3 shadow-lg shadow-blue-500/30">📦</div>
        <h2 class="text-lg font-black tracking-wide">Mia組 派件營運工作台</h2>
        <p class="text-xs text-slate-400 mt-1">請輸入姓名與密碼以繼續</p>
      </div>
      <form onsubmit="handleSystemLogin(event)" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5">組員名稱</label>
          <input type="text" id="login-username-input" required placeholder="請輸入姓名 (例如: 詠豪)" 
                 class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5">密碼</label>
          <input type="password" id="login-password-input" required placeholder="請輸入密碼" 
                 class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition">
        </div>
        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-black rounded-xl text-sm shadow-md transition">
          進入工作台
        </button>
      </form>
    </div>
  </div>

  <!-- 頂部導覽列 -->
  <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center font-black shadow-md">📦</div>
        <div>
          <h1 class="text-sm font-black tracking-wide">Mia組 - 派件營運全功能工作台</h1>
          <div class="flex items-center space-x-2 mt-0.5">
            <span id="role-display-badge" class="px-1.5 py-0.5 rounded text-[10px] bg-slate-800 text-slate-300 border border-slate-700 font-semibold">👤 載入中...</span>
            <button type="button" onclick="logoutSystem()" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-bold rounded transition">🔒 登出</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div id="dashboard-summary-cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6"></div>
    <div class="bg-white rounded-2xl border border-slate-200 shadow-xs p-5">
      <h3 class="text-sm font-black text-slate-900 mb-4">📋 報數與結算紀錄</h3>
      <table class="w-full text-left">
        <thead><tr class="text-slate-400 text-[11px] font-black border-b border-slate-200"><th class="p-3">姓名</th><th class="p-3">身份</th></tr></thead>
        <tbody id="reportTableBody"></tbody>
      </table>
    </div>
  </main>

  <script>
    // 你的完整團隊名單
    let accounts = [
      { name: 'Mia', id: 'ADMIN', category: '總管理員', zone: '所有', password: '123' },
      { name: '詠豪', id: 'A01', category: '組長', zone: 'A隊', password: '123' },
      { name: '盧智聰', id: 'KM04', category: '步兵', zone: 'KM隊', password: '123' },
      { name: '姜嘉敏 KK', id: 'KM05', category: '步兵', zone: 'KM隊', password: '123' },
      { name: '周健', id: 'A03', category: '步兵', zone: 'A隊', password: '123' },
      { name: '黃奕烽', id: 'A04', category: '步兵', zone: 'A隊', password: '123' },
      { name: '張兆偉', id: 'C01', category: '步兵', zone: 'C隊', password: '123' },
      { name: '小肥', id: 'B01', category: '步兵', zone: 'B隊', password: '123' },
      { name: '吳嘉榮', id: 'B02', category: '步兵', zone: 'B隊', password: '123' },
      { name: '景鴻', id: 'B03', category: '組長', zone: 'B隊', password: '123' },
      { name: '俊華', id: 'C02', category: '組長', zone: 'C隊', password: '123' },
      { name: '倪志康', id: 'KM06', category: '步兵', zone: 'KM隊', password: '123' },
      { name: '吳瑋儒', id: 'KM07', category: '步兵', zone: 'KM隊', password: '123' },
      { name: '王利民', id: 'KM08', category: '步兵', zone: 'KM隊', password: '123' }
    ];

    let currentRole = '';

    function handleSystemLogin(event) {
      event.preventDefault();
      const userInp = document.getElementById('login-username-input').value.trim();
      const passInp = document.getElementById('login-password-input').value.trim();

      const user = accounts.find(a => a.name === userInp);
      
      if (user && passInp === user.password) {
        currentRole = user.name;
        document.getElementById('modal-system-login').style.display = 'none';
        renderRoleView();
        alert('✅ 歡迎使用，' + user.name + '！');
      } else {
        alert('❌ 帳號不存在或密碼錯誤！請再次確認。');
      }
    }

    function logoutSystem() {
      document.getElementById('modal-system-login').style.display = 'flex';
    }

    function renderRoleView() {
      const user = accounts.find(a => a.name === currentRole);
      const badge = document.getElementById('role-display-badge');
      if (user && badge) {
        badge.textContent = '👤 ' + user.name + ' (' + user.category + ')';
      }
    }
  </script>
</body>
</html>
