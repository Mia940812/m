<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mia組 - 派貨員獨立報數與對數結算系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    button, input, select, textarea { touch-action: manipulation; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- 登入門禁 -->
  <div id="view-login" class="flex-1 flex items-center justify-center p-4 min-h-screen bg-slate-900">
    <div class="w-full max-w-sm bg-white rounded-3xl p-6 space-y-4 shadow-2xl">
      <div class="text-center space-y-1">
        <div class="inline-flex px-4 py-1.5 rounded-xl bg-blue-600 text-white font-black text-lg">Mia組</div>
        <h2 class="text-base font-extrabold text-slate-900">派件報數與排更結算系統</h2>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="font-bold text-slate-700 block mb-1">登入帳號 (ID)</label>
          <input id="login-username" type="text" placeholder="KM001 / A001 / KM02" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-bold uppercase">
        </div>
        <div>
          <label class="font-bold text-slate-700 block mb-1">密碼</label>
          <input id="login-password" type="password" placeholder="請輸入密碼" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-bold">
        </div>
        <div id="login-error-msg" class="p-2 bg-rose-50 border border-rose-200 rounded-xl text-rose-600 font-bold text-center hidden">
          帳號或密碼不正確！
        </div>
        <button onclick="handleLogin()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold shadow-md">
          登入系統
        </button>
        <div class="pt-2 text-center border-t text-[11px] text-slate-400 flex justify-between">
          <span>Mia Management</span>
          <button onclick="resetSystemData()" type="button" class="text-rose-600 font-bold">重置快取</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 系統主體 -->
  <div id="app-container" class="hidden flex-1 flex flex-col min-h-screen">
    <header class="bg-white border-b border-slate-200 px-4 py-2.5 sticky top-0 z-30 shadow-sm">
      <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2 cursor-pointer" onclick="switchNavTab('main')">
          <div class="h-8 px-3 rounded-xl bg-blue-600 flex items-center justify-center text-white font-black text-sm">Mia組</div>
          <span id="header-user-info" class="text-xs font-bold text-slate-700">登入中</span>
        </div>
        <div class="flex items-center gap-1.5 flex-wrap text-xs font-bold">
          <input id="global-system-date" type="date" class="bg-slate-100 border rounded-xl px-2 py-1 text-xs">
          <button onclick="switchNavTab('main')" class="px-3 py-1.5 rounded-xl bg-blue-600 text-white">主工作台</button>
          <button onclick="openModal2()" class="px-3 py-1.5 rounded-xl bg-blue-50 text-blue-700 border border-blue-200">2- 分區排更</button>
          <button onclick="openUniversalExportModal('shift_truck')" class="px-3 py-1.5 rounded-xl bg-indigo-600 text-white">📲 匯出排更</button>
          <button onclick="openUniversalExportModal('ALL')" class="px-3 py-1.5 rounded-xl bg-emerald-600 text-white">📤 匯出中心</button>
          <button onclick="handleLogout()" class="px-3 py-1.5 bg-slate-100 text-slate-600 rounded-xl">登出</button>
        </div>
      </div>
    </header>

    <!-- 主管理台 -->
    <main id="view-admin" class="flex-1 p-4 max-w-7xl w-full mx-auto space-y-4 tab-content hidden">
      <div class="flex justify-between items-center bg-white p-3.5 rounded-2xl border">
        <span class="text-sm font-extrabold text-slate-900">總管理員全盤大表</span>
        <button onclick="openModal2()" class="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl">2- 進入分區排班看板</button>
      </div>
      <div id="admin-cards" class="space-y-3"></div>
    </main>

    <!-- 組長 / 步兵台 -->
    <main id="view-user" class="flex-1 p-4 max-w-lg w-full mx-auto space-y-4 tab-content hidden">
      <div class="bg-white p-5 rounded-3xl border space-y-3">
        <h3 id="user-name-title" class="font-black text-base text-slate-900">步兵工作台</h3>
        <p class="text-xs text-slate-500">今日已分配圍欄：<b id="user-fence-display" class="text-blue-600">-</b></p>
        <button onclick="openModal2()" class="w-full py-2.5 bg-blue-600 text-white rounded-xl text-xs font-bold">查看分區排班分工</button>
      </div>
    </main>
  </div>

  <!-- 2- 分區排更視窗 -->
  <div id="modal-assignments" class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-3 z-50 hidden">
    <div class="bg-white rounded-3xl p-5 max-w-4xl w-full shadow-2xl space-y-4 max-h-[92vh] overflow-y-auto custom-scrollbar">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-extrabold text-base text-slate-900">2- 分區排班分工名冊</h3>
        <button onclick="closeModal2()" class="p-1 font-bold text-slate-400">✕</button>
      </div>

      <div class="flex justify-between items-center flex-wrap gap-2 text-xs font-bold">
        <div class="flex gap-1.5">
          <button type="button" onclick="switchAssignmentTab('kt')" id="tab-assign-kt" class="px-3.5 py-1.5 rounded-xl bg-blue-600 text-white">📍 觀塘區</button>
          <button type="button" onclick="switchAssignmentTab('east')" id="tab-assign-east" class="px-3.5 py-1.5 rounded-xl bg-slate-100 text-slate-700">📍 東區</button>
          <button type="button" onclick="switchAssignmentTab('st')" id="tab-assign-st" class="px-3.5 py-1.5 rounded-xl bg-slate-100 text-slate-700">📍 沙田區</button>
        </div>
        <div class="flex bg-slate-100 p-1 rounded-xl border">
          <button type="button" onclick="setAssignmentViewMode('byFence')" id="btn-view-by-fence" class="px-2.5 py-1 rounded-lg bg-white text-blue-700 shadow-sm">🏢 按圍欄檢視</button>
          <button type="button" onclick="setAssignmentViewMode('byRider')" id="btn-view-by-rider" class="px-2.5 py-1 rounded-lg text-slate-600">👤 按同事檢視</button>
        </div>
      </div>

      <div class="bg-blue-50/70 p-3 rounded-2xl border border-blue-200 text-xs space-y-2">
        <div class="font-bold text-blue-950">快速指派排班：</div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
          <select id="new-assign-fence-select" class="bg-white border rounded-xl p-2 font-bold"></select>
          <select id="new-assign-rider-select" class="bg-white border rounded-xl p-2 font-bold"></select>
          <select id="new-assign-order-select" class="bg-white border rounded-xl p-2 font-bold">
            <option value="第 1 順位">第 1 順位 (預設首位)</option>
            <option value="第 2 順位">第 2 順位</option>
            <option value="第 3 順位">第 3 順位</option>
            <option value="彈性支援">彈性支援</option>
          </select>
        </div>
        <button onclick="saveNewAssignmentRow()" class="w-full py-2 bg-blue-600 text-white rounded-xl font-bold">確認加入排班</button>
      </div>

      <div id="m2-fences-board-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>

      <div class="flex justify-end pt-2 border-t">
        <button onclick="closeModal2()" class="px-5 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold">關閉</button>
      </div>
    </div>
  </div>

  <!-- 匯出視窗 -->
  <div id="modal-universal-export" class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-3xl p-5 max-w-2xl w-full shadow-2xl space-y-3 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-sm text-slate-900">📤 匯出資料中心</h3>
        <button onclick="closeUniversalExportModal()" class="p-1 font-bold">✕</button>
      </div>
      <textarea id="universal-export-textarea" rows="10" readonly class="w-full bg-slate-50 border rounded-xl p-3 font-mono text-xs"></textarea>
      <div class="flex gap-2">
        <button onclick="copyUniversalWhatsAppText()" class="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-bold">一鍵複製 WhatsApp</button>
        <button onclick="closeUniversalExportModal()" class="px-4 py-2.5 bg-slate-100 rounded-xl text-xs font-bold">關閉</button>
      </div>
    </div>
  </div>

  <script>
    const defaultZoneFences = {
      kt: [{ id: '01E', name: '01E Koko Hills' }, { id: '02E', name: '02E 觀塘工商區1號' }, { id: '03E', name: '03E 觀塘工商區2號' }, { id: '11E', name: '11E 麗港城-1號托' }],
      east: [{ id: '03F', name: '03F 東旭苑' }, { id: '69F', name: '69F 峻峰花園' }],
      st: [{ id: 'ST_01', name: 'ST_01 沙田第一城' }]
    };

    const initialAccounts = [
      { id: 'KM001', name: 'Mia', role: '管理員', team: 'Mia自營步兵', password: 'mia888' },
      { id: 'A001', name: '景鴻', role: '組長', team: 'A組', password: '100' },
      { id: 'B001', name: '詠豪', role: '組長', team: 'B組', password: '201' },
      { id: 'C001', name: '俊華', role: '普通步兵', team: 'C組', password: '303' },
      { id: 'KM02', name: '吳嘉榮', role: '自營步兵', team: 'Mia自營步兵', password: '123' },
      { id: 'KM03', name: '周健', role: '自營步兵', team: 'Mia自營步兵', password: '123' }
    ];

    const defaultAssignments = {
      kt: [
        { id: 'B001', name: '詠豪', team: 'B組', fence: '03E 觀塘工商區2號', order: '第 1 順位' },
        { id: 'KM03', name: '周健', team: 'Mia自營步兵', fence: '03E 觀塘工商區2號', order: '第 2 順位' }
      ],
      east: [{ id: 'KM02', name: '吳嘉榮', team: 'Mia自營步兵', fence: '69F 峻峰花園', order: '第 1 順位' }],
      st: [{ id: 'KM03', name: '周健', team: 'Mia自營步兵', fence: 'ST_01 沙田第一城', order: '第 1 順位' }]
    };

    const DB_KEY = 'MIA_APP_DATA_FINAL_2026_';
    let zoneFences = JSON.parse(localStorage.getItem(DB_KEY + 'FENCES')) || defaultZoneFences;
    let accounts = JSON.parse(localStorage.getItem(DB_KEY + 'ACCOUNTS')) || initialAccounts;
    let zoneAssignments = JSON.parse(localStorage.getItem(DB_KEY + 'ASSIGNS')) || defaultAssignments;

    let currentAssignTab = 'kt';
    let currentAssignmentViewMode = 'byFence';
    let loggedInUser = null;

    function saveData() {
      localStorage.setItem(DB_KEY + 'FENCES', JSON.stringify(zoneFences));
      localStorage.setItem(DB_KEY + 'ACCOUNTS', JSON.stringify(accounts));
      localStorage.setItem(DB_KEY + 'ASSIGNS', JSON.stringify(zoneAssignments));
    }

    function resetSystemData() {
      if (confirm('確定清除快取重置為預設資料嗎？')) {
        localStorage.clear();
        location.reload();
      }
    }

    function handleLogin() {
      const u = (document.getElementById('login-username').value || '').trim().toUpperCase();
      const p = (document.getElementById('login-password').value || '').trim();
      const err = document.getElementById('login-error-msg');
      err.classList.add('hidden');

      if ((u === 'KM001' || u === 'ADMIN') && (p === 'mia888' || p === 'MIA888')) {
        loggedInUser = accounts.find(a => a.id === 'KM001') || accounts[0];
        enterApp();
        return;
      }

      const acc = accounts.find(a => a.id.toUpperCase() === u && String(a.password).trim() === p);
      if (acc) {
        loggedInUser = acc;
        enterApp();
        return;
      }

      err.classList.remove('hidden');
    }

    function enterApp() {
      document.getElementById('view-login').classList.add('hidden');
      document.getElementById('app-container').classList.remove('hidden');
      document.getElementById('header-user-info').innerText = `${loggedInUser.name} (${loggedInUser.id} • ${loggedInUser.role})`;

      switchNavTab('main');
    }

    function handleLogout() {
      loggedInUser = null;
      document.getElementById('app-container').classList.add('hidden');
      document.getElementById('view-login').classList.remove('hidden');
    }

    function switchNavTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      if (tab === 'main') {
        if (loggedInUser.role === '管理員') {
          document.getElementById('view-admin').classList.remove('hidden');
          renderAdminView();
        } else {
          document.getElementById('view-user').classList.remove('hidden');
          renderUserView();
        }
      }
    }

    function renderAdminView() {
      const container = document.getElementById('admin-cards');
      container.innerHTML = '';
      accounts.forEach(acc => {
        if (acc.id === 'KM001') return;
        const div = document.createElement('div');
        div.className = 'bg-white p-3.5 rounded-2xl border flex justify-between items-center text-xs';
        div.innerHTML = `
          <div>
            <b class="text-slate-900">${acc.name}</b> <span class="text-blue-600 font-mono">(${acc.id})</span>
            <span class="text-slate-400 ml-1">${acc.team} • ${acc.role}</span>
          </div>
          <span class="text-slate-500 font-mono">密碼: ${acc.password}</span>
        `;
        container.appendChild(div);
      });
    }

    function renderUserView() {
      document.getElementById('user-name-title').innerText = `${loggedInUser.name} (${loggedInUser.id}) 工作台`;
      const myFences = [];
      ['kt', 'east', 'st'].forEach(z => {
        (zoneAssignments[z] || []).filter(a => a.id === loggedInUser.id).forEach(a => {
          myFences.push(a.fence);
        });
      });
      document.getElementById('user-fence-display').innerText = myFences.length ? myFences.join('、') : '暫未編排';
    }

    function openModal2() {
      const rSel = document.getElementById('new-assign-rider-select');
      rSel.innerHTML = '';
      accounts.filter(a => a.id !== 'KM001').forEach(a => {
        rSel.innerHTML += `<option value="${a.id}">${a.name} (${a.id})</option>`;
      });
      switchAssignmentTab(currentAssignTab);
      document.getElementById('modal-assignments').classList.remove('hidden');
    }

    function closeModal2() {
      document.getElementById('modal-assignments').classList.add('hidden');
    }

    function setAssignmentViewMode(mode) {
      currentAssignmentViewMode = mode;
      document.getElementById('btn-view-by-fence').className = mode === 'byFence' ? 'px-2.5 py-1 rounded-lg bg-white text-blue-700 shadow-sm font-bold' : 'px-2.5 py-1 rounded-lg text-slate-600 font-bold';
      document.getElementById('btn-view-by-rider').className = mode === 'byRider' ? 'px-2.5 py-1 rounded-lg bg-white text-indigo-700 shadow-sm font-bold' : 'px-2.5 py-1 rounded-lg text-slate-600 font-bold';
      renderFencesBoardGrid();
    }

    function switchAssignmentTab(zone) {
      currentAssignTab = zone;
      ['kt', 'east', 'st'].forEach(z => {
        const btn = document.getElementById(`tab-assign-${z}`);
        if (btn) btn.className = z === zone ? 'px-3.5 py-1.5 rounded-xl bg-blue-600 text-white' : 'px-3.5 py-1.5 rounded-xl bg-slate-100 text-slate-700';
      });

      const fSel = document.getElementById('new-assign-fence-select');
      fSel.innerHTML = '';
      (zoneFences[zone] || []).forEach(f => {
        fSel.innerHTML += `<option value="${f.name}">${f.name}</option>`;
      });

      renderFencesBoardGrid();
    }

    function renderFencesBoardGrid() {
      const container = document.getElementById('m2-fences-board-grid');
      container.innerHTML = '';
      const assigns = zoneAssignments[currentAssignTab] || [];
      const orderWeight = { '第 1 順位': 1, '第 2 順位': 2, '第 3 順位': 3, '彈性支援': 99 };

      if (currentAssignmentViewMode === 'byFence') {
        (zoneFences[currentAssignTab] || []).forEach(fence => {
          const riders = assigns
            .map((item, originalIndex) => ({ ...item, originalIndex }))
            .filter(item => item.fence === fence.name)
            .sort((a, b) => (orderWeight[a.order] || 50) - (orderWeight[b.order] || 50));

          const card = document.createElement('div');
          card.className = `p-3 rounded-2xl border ${riders.length ? 'bg-white border-blue-200' : 'bg-slate-50 border-slate-200'} space-y-2`;

          let rList = '';
          if (!riders.length) {
            rList = `<div class="text-[11px] text-slate-400 py-2 text-center">未有排班</div>`;
          } else {
            rList = '<div class="space-y-1">';
            riders.forEach(r => {
              const isFirst = r.order === '第 1 順位' || !r.order;
              rList += `
                <div class="p-1.5 rounded-lg border flex items-center justify-between text-xs bg-slate-50">
                  <div>
                    ${!isFirst ? `<span class="px-1.5 py-0.2 rounded text-[10px] font-bold bg-slate-200 mr-1">${r.order}</span>` : ''}
                    <b>${r.name}</b> <span class="text-blue-600 font-mono text-[11px]">(${r.id})</span>
                  </div>
                  <button onclick="deleteAssignmentRowByIndex(${r.originalIndex})" class="text-rose-600 font-bold px-1">✕</button>
                </div>
              `;
            });
            rList += '</div>';
          }

          card.innerHTML = `
            <div class="flex justify-between items-center border-b pb-1">
              <span class="font-bold text-xs text-slate-900">${fence.name}</span>
              <span class="text-[10px] text-blue-600 font-bold">${riders.length}人</span>
            </div>
            ${rList}
          `;
          container.appendChild(card);
        });
      } else {
        accounts.filter(a => a.id !== 'KM001').forEach(rider => {
          const myF = assigns
            .map((item, originalIndex) => ({ ...item, originalIndex }))
            .filter(item => item.id === rider.id);

          const card = document.createElement('div');
          card.className = `p-3 rounded-2xl border ${myF.length ? 'bg-white border-indigo-200' : 'bg-slate-50 border-slate-200'} space-y-2`;

          let fList = '';
          if (!myF.length) {
            fList = `<div class="text-[11px] text-slate-400 py-2 text-center">無排班</div>`;
          } else {
            fList = '<div class="space-y-1">';
            myF.forEach(f => {
              fList += `
                <div class="p-1.5 rounded-lg border flex items-center justify-between text-xs bg-indigo-50/50">
                  <b>${f.fence}</b>
                  <button onclick="deleteAssignmentRowByIndex(${f.originalIndex})" class="text-rose-600 font-bold px-1">✕</button>
                </div>
              `;
            });
            fList += '</div>';
          }

          card.innerHTML = `
            <div class="flex justify-between items-center border-b pb-1">
              <span class="font-bold text-xs text-slate-900">${rider.name} (${rider.id})</span>
              <span class="text-[10px] text-indigo-600 font-bold">${myF.length}圍欄</span>
            </div>
            ${fList}
          `;
          container.appendChild(card);
        });
      }
    }

    function saveNewAssignmentRow() {
      const rId = document.getElementById('new-assign-rider-select').value;
      const fence = document.getElementById('new-assign-fence-select').value;
      const order = document.getElementById('new-assign-order-select').value;

      const acc = accounts.find(a => a.id === rId);
      if (!acc) return;

      zoneAssignments[currentAssignTab] = zoneAssignments[currentAssignTab] || [];
      zoneAssignments[currentAssignTab].push({
        id: acc.id,
        name: acc.name,
        team: acc.team,
        fence: fence,
        order: order
      });

      saveData();
      renderFencesBoardGrid();
    }

    function deleteAssignmentRowByIndex(idx) {
      zoneAssignments[currentAssignTab].splice(idx, 1);
      saveData();
      renderFencesBoardGrid();
    }

    function openUniversalExportModal(mod) {
      const today = document.getElementById('global-system-date').value || new Date().toISOString().split('T')[0];
      const zoneNames = { kt: '📍 觀塘區', east: '📍 東區', st: '📍 沙田區' };
      let msg = `📅 【Mia組】每日分區排班分工表 (${today})\n===========================\n`;

      ['kt', 'east', 'st'].forEach(z => {
        msg += `\n【${zoneNames[z]}】\n`;
        const assigns = zoneAssignments[z] || [];
        const fences = zoneFences[z] || [];

        fences.forEach(f => {
          const riders = assigns.filter(item => item.fence === f.name);
          if (riders.length) {
            const names = riders.map(r => (r.order === '第 1 順位' || !r.order) ? `${r.name}` : `[${r.order}] ${r.name}`).join(' + ');
            msg += `  • ${f.name} ➜ ${names}\n`;
          }
        });
      });

      document.getElementById('universal-export-textarea').value = msg;
      document.getElementById('modal-universal-export').classList.remove('hidden');
    }

    function closeUniversalExportModal() {
      document.getElementById('modal-universal-export').classList.add('hidden');
    }

    function copyUniversalWhatsAppText() {
      const txt = document.getElementById('universal-export-textarea');
      txt.select();
      navigator.clipboard.writeText(txt.value);
      alert('已複製到剪貼簿！');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      const dateInp = document.getElementById('global-system-date');
      if (dateInp) dateInp.value = today;
      saveData();
    });
  </script>
</body>
</html>
