<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mia組 派件報數與薪酬結算系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <script>
    // ==========================================
    // 1. 雲端設定與資料核心 (保證永不卡死登入)
    // ==========================================
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwh7HcgM8E-1odrhbrt0jD3_4yH0Kf_b1oui5Pi2otkqfw9V41T1YJQVeL_gfV4x95Ryw/exec';
    let isCloudLoaded = true;

    let accounts = JSON.parse(localStorage.getItem('mia_accounts')) || [
      { id: 'KM001', name: 'Mia (管理員)', role: 'admin', pin: 'mia888' },
      { id: 'A001', name: '派件員 A', role: 'driver', pin: '123456' },
      { id: 'KM02', name: '派件員 B', role: 'driver', pin: '123456' }
    ];

    let zoneFences = JSON.parse(localStorage.getItem('mia_fences')) || [
      { id: 'F01', name: '葵涌工業區', count: 120, rate: 2.5 },
      { id: 'F02', name: '荃灣住宅區', count: 85, rate: 3.0 }
    ];

    let truckRoutes = JSON.parse(localStorage.getItem('mia_trucks')) || [];
    let shiftReports = JSON.parse(localStorage.getItem('mia_reports')) || [];
    let currentUser = null;

    // 儲存資料並非同步送去 Google Sheet
    async function saveData(key, data) {
      localStorage.setItem('mia_' + key, JSON.stringify(data));
      if (!GOOGLE_SCRIPT_URL) return;
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ key: key, data: data }),
          mode: 'no-cors'
        });
        console.log(`[Cloud] ${key} 同步成功`);
      } catch (err) {
        console.warn(`[Cloud] 雲端同步略過:`, err);
      }
    }

    // 背景讀取，絕不阻礙登入介面
    async function loadCloudData() {
      if (!GOOGLE_SCRIPT_URL) return;
      try {
        const res = await Promise.race([
          fetch(GOOGLE_SCRIPT_URL),
          new Promise((_, reject) => setTimeout(() => reject(new Error('超時')), 2000))
        ]);
        const data = await res.json();
        if (data && typeof data === 'object') {
          if (data.accounts) { accounts = data.accounts; localStorage.setItem('mia_accounts', JSON.stringify(accounts)); }
          if (data.fences) { zoneFences = data.fences; localStorage.setItem('mia_fences', JSON.stringify(zoneFences)); }
          if (data.trucks) { truckRoutes = data.trucks; localStorage.setItem('mia_trucks', JSON.stringify(truckRoutes)); }
          if (data.reports) { shiftReports = data.reports; localStorage.setItem('mia_reports', JSON.stringify(shiftReports)); }
        }
      } catch (e) {
        console.log('背景加載完成/使用本地快取');
      }
    }
  </script>

  <!-- 登入卡片 -->
  <div id="login-section" class="w-full max-w-md bg-white rounded-3xl p-8 text-slate-800 shadow-2xl transition-all">
    <div class="text-center mb-6">
      <span class="bg-blue-600 text-white font-bold px-6 py-1.5 rounded-full text-lg tracking-wide inline-block shadow-md mb-3">Mia組</span>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">派件報數與薪酬結算系統</h1>
      <p id="cloud-status-text" class="text-xs text-emerald-600 font-medium mt-1">● 雲端資料庫已就緒</p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">登入帳號 (ID)</label>
        <input type="text" id="login-id" placeholder="KM001 / A001 / KM02" required
          class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white text-slate-900 font-medium outline-none transition" />
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">密碼</label>
        <input type="password" id="login-pin" placeholder="請輸入密碼" required
          class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white text-slate-900 font-medium outline-none transition" />
      </div>

      <button type="submit" id="login-btn"
        class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-3.5 rounded-xl shadow-lg hover:shadow-blue-500/30 transition duration-150">
        登入系統
      </button>
    </form>

    <div class="mt-6 flex justify-between items-center text-xs text-slate-400 border-t border-slate-100 pt-4">
      <span class="flex items-center gap-1"><i class="fa-solid fa-cloud text-blue-500"></i> 雲端即時同步</span>
      <button onclick="resetDefaultData()" class="text-red-500 hover:underline">重置預設圍欄</button>
    </div>
  </div>

  <!-- 系統主介面 -->
  <div id="main-app" class="hidden w-full max-w-5xl bg-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl border border-slate-700">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center pb-6 border-b border-slate-700 gap-4">
      <div>
        <div class="flex items-center gap-3">
          <span class="bg-blue-600 text-white font-bold px-3 py-1 rounded-lg text-sm">Mia組</span>
          <h2 id="user-display" class="text-xl font-bold text-white">歡迎使用</h2>
        </div>
        <p class="text-xs text-slate-400 mt-1">系統日期：<span id="current-date"></span></p>
      </div>
      <div class="flex items-center gap-3 w-full md:w-auto justify-end">
        <button onclick="handleSaveAll()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold px-4 py-2 rounded-xl shadow transition flex items-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up"></i> 立即儲存同步
        </button>
        <button onclick="handleLogout()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-semibold px-4 py-2 rounded-xl transition">
          登出
        </button>
      </div>
    </div>

    <!-- 圍欄與派件管理清單 -->
    <div class="mt-6 space-y-6">
      <div>
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-bold text-slate-200 flex items-center gap-2"><i class="fa-solid fa-map-location-dot text-blue-400"></i> 圍欄與貨量設定</h3>
          <button onclick="addNewFence()" class="bg-blue-600 hover:bg-blue-500 text-xs font-bold px-3 py-1.5 rounded-lg text-white">+ 新增圍欄</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-300">
            <thead class="bg-slate-900/60 text-slate-400 text-xs uppercase">
              <tr>
                <th class="px-4 py-3 rounded-l-xl">圍欄編號</th>
                <th class="px-4 py-3">圍欄名稱</th>
                <th class="px-4 py-3">標準件數</th>
                <th class="px-4 py-3">每件單價 ($)</th>
                <th class="px-4 py-3 rounded-r-xl text-center">操作</th>
              </tr>
            </thead>
            <tbody id="fence-table-body" class="divide-y divide-slate-700">
              <!-- 動態生成 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 2. 登入、介面與操作邏輯
    // ==========================================
    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('login-id').value.trim();
      const pin = document.getElementById('login-pin').value.trim();

      const user = accounts.find(a => a.id.toUpperCase() === id.toUpperCase() && a.pin === pin);
      if (user) {
        currentUser = user;
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('main-app').classList.remove('hidden');
        document.getElementById('user-display').innerText = `${user.name} (${user.id})`;
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('zh-HK');
        renderFences();
      } else {
        alert('❌ 帳號或密碼錯誤！請檢查後再試。\n預設帳號：KM001，密碼：mia888');
      }
    }

    function handleLogout() {
      currentUser = null;
      document.getElementById('main-app').classList.add('hidden');
      document.getElementById('login-section').classList.remove('hidden');
      document.getElementById('login-pin').value = '';
    }

    function renderFences() {
      const tbody = document.getElementById('fence-table-body');
      if (!tbody) return;
      tbody.innerHTML = zoneFences.map((f, index) => `
        <tr class="hover:bg-slate-700/40 transition">
          <td class="px-4 py-3 font-semibold text-blue-400">${f.id}</td>
          <td class="px-4 py-3"><input type="text" value="${f.name}" onchange="updateFence(${index}, 'name', this.value)" class="bg-slate-900 border border-slate-700 px-2 py-1 rounded text-white text-sm w-full max-w-[150px]"></td>
          <td class="px-4 py-3"><input type="number" value="${f.count}" onchange="updateFence(${index}, 'count', Number(this.value))" class="bg-slate-900 border border-slate-700 px-2 py-1 rounded text-white text-sm w-20"></td>
          <td class="px-4 py-3"><input type="number" step="0.1" value="${f.rate}" onchange="updateFence(${index}, 'rate', Number(this.value))" class="bg-slate-900 border border-slate-700 px-2 py-1 rounded text-white text-sm w-20"></td>
          <td class="px-4 py-3 text-center"><button onclick="deleteFence(${index})" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-trash"></i></button></td>
        </tr>
      `).join('');
    }

    function updateFence(index, field, value) {
      zoneFences[index][field] = value;
      saveData('fences', zoneFences);
    }

    function addNewFence() {
      const newId = 'F' + String(zoneFences.length + 1).padStart(2, '0');
      zoneFences.push({ id: newId, name: '新圍欄區域', count: 100, rate: 2.5 });
      renderFences();
      saveData('fences', zoneFences);
    }

    function deleteFence(index) {
      if (confirm('確定刪除此圍欄？')) {
        zoneFences.splice(index, 1);
        renderFences();
        saveData('fences', zoneFences);
      }
    }

    async function handleSaveAll() {
      await saveData('fences', zoneFences);
      await saveData('accounts', accounts);
      alert('✅ 所有資料已成功儲存並同步至 Google Sheet！');
    }

    function resetDefaultData() {
      if (confirm('確定重置預設資料？')) {
        zoneFences = [
          { id: 'F01', name: '葵涌工業區', count: 120, rate: 2.5 },
          { id: 'F02', name: '荃灣住宅區', count: 85, rate: 3.0 }
        ];
        saveData('fences', zoneFences);
        renderFences();
        alert('預設圍欄已重置！');
      }
    }

    // 初始化加載
    window.addEventListener('DOMContentLoaded', () => {
      loadCloudData();
    });
  </script>
</body>
</html>
