<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mia組團隊管理系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-12">

  <!-- 上方頂欄 -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
          ⚡ Mia組團隊管理系統
        </h1>
        <span id="role-display-badge" class="px-2 py-0.5 rounded text-xs bg-slate-700 text-slate-300 font-semibold">
          --
        </span>
      </div>

      <div class="flex items-center gap-4 text-xs">
        <div>
          <label class="text-slate-400 mr-1">系統日期:</label>
          <input type="date" id="global-system-date" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-white">
        </div>
        <div>
          <label class="text-slate-400 mr-1">切換身份:</label>
          <select id="current-user-role-select" onchange="changeUserRole(this.value)" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-white">
            <!-- 動態載入 -->
          </select>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 mt-6">
    <!-- 主導航 TAB 按鈕 -->
    <div class="flex flex-wrap gap-2 border-b border-slate-700 mb-6">
      <button onclick="switchTab('tab-walker-payout')" id="btn-tab-walker-payout" class="tab-btn px-4 py-2 font-bold rounded-t-lg bg-emerald-600 text-white shadow">
        💵 步兵出糧紀錄
      </button>
      <button onclick="switchTab('tab-leaderboard')" id="btn-tab-leaderboard" class="tab-btn px-4 py-2 font-bold rounded-t-lg bg-slate-800 text-slate-400 hover:bg-slate-700">
        🏆 違規龍虎榜
      </button>
    </div>

    <!-- ================= TAB 1: 步兵出糧紀錄 ================= -->
    <div id="tab-walker-payout" class="tab-content space-y-6">
      <!-- 新增出糧紀錄表單 -->
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md">
        <h2 class="text-lg font-bold text-emerald-400 mb-4 flex items-center gap-2">
          ➕ 新增步兵出糧紀錄
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
          <!-- 日期 -->
          <div>
            <label class="block text-xs text-slate-400 mb-1">出糧日期</label>
            <input type="date" id="wp-inp-date" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-sm text-white focus:outline-none focus:border-emerald-500">
          </div>
          <!-- 步兵名字（下拉） -->
          <div>
            <label class="block text-xs text-slate-400 mb-1">步兵名字</label>
            <select id="wp-inp-staff" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-sm text-white focus:outline-none focus:border-emerald-500">
              <option value="步兵 A">步兵 A</option>
              <option value="步兵 B">步兵 B</option>
              <option value="步兵 C">步兵 C</option>
              <option value="步兵 D">步兵 D</option>
            </select>
          </div>
          <!-- 當日工資 -->
          <div>
            <label class="block text-xs text-slate-400 mb-1">當日工資 (HK$)</label>
            <input type="number" id="wp-inp-amount" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-sm text-white focus:outline-none focus:border-emerald-500">
          </div>
          <!-- 出糧方式（下拉） -->
          <div>
            <label class="block text-xs text-slate-400 mb-1">出糧方式</label>
            <select id="wp-inp-method" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-sm text-white focus:outline-none focus:border-emerald-500">
              <option value="轉數快">轉數快</option>
              <option value="支付寶">支付寶</option>
              <option value="銀行轉賬">銀行轉賬</option>
              <option value="現金">現金</option>
            </select>
          </div>
          <!-- 備註/單號 -->
          <div>
            <label class="block text-xs text-slate-400 mb-1">備註/單號</label>
            <input type="text" id="wp-inp-remark" placeholder="選填" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-sm text-white focus:outline-none focus:border-emerald-500">
          </div>
          <!-- 提交按鈕 -->
          <div class="flex items-end">
            <button onclick="addWalkerPayoutRecord()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-1.5 px-3 rounded text-sm transition shadow">
              存入紀錄
            </button>
          </div>
        </div>
      </div>

      <!-- 獨立步兵篩選與 WhatsApp 匯出 -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-3">
          <span class="text-sm font-bold text-slate-300">選擇檢視步兵：</span>
          <select id="wp-filter-staff" onchange="renderWalkerPayoutTable()" class="bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            <option value="ALL">全部步兵</option>
            <option value="步兵 A">步兵 A</option>
            <option value="步兵 B">步兵 B</option>
            <option value="步兵 C">步兵 C</option>
            <option value="步兵 D">步兵 D</option>
          </select>
        </div>
        <button onclick="exportWalkerPayoutWhatsApp()" class="bg-green-600 hover:bg-green-500 text-white text-xs font-bold px-3 py-2 rounded flex items-center gap-1 shadow">
          📲 匯出該步兵出糧明細 (WhatsApp)
        </button>
      </div>

      <!-- 出糧列表表格 -->
      <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-lg">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-300">
            <thead class="bg-slate-900 text-slate-400 text-xs uppercase border-b border-slate-700">
              <tr>
                <th class="p-3">轉賬狀態 (打剔)</th>
                <th class="p-3">日期</th>
                <th class="p-3">步兵姓名</th>
                <th class="p-3">當日工資</th>
                <th class="p-3">出糧方式</th>
                <th class="p-3">備註</th>
                <th class="p-3 text-center">操作</th>
              </tr>
            </thead>
            <tbody id="walker-payout-tbody" class="divide-y divide-slate-700/50">
              <!-- 動態載入內容 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ================= TAB 2: 違規龍虎榜 ================= -->
    <div id="tab-leaderboard" class="tab-content hidden space-y-6">
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md">
        <h2 class="text-lg font-bold text-rose-400 mb-4 flex items-center gap-2">
          ⚠️ 登記違規罰款紀錄
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">違規人員</label>
            <select id="lb-inp-staff" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-sm text-white">
              <option value="步兵 A">步兵 A</option>
              <option value="步兵 B">步兵 B</option>
              <option value="步兵 C">步兵 C</option>
              <option value="步兵 D">步兵 D</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">罰款金額 (HK$)</label>
            <input type="number" id="lb-inp-amount" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-sm text-white">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">違規原因</label>
            <input type="text" id="lb-inp-reason" placeholder="如：遲到、未影相" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-sm text-white">
          </div>
          <div class="flex items-end">
            <button onclick="saveNewPenaltyRecord()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-1.5 px-3 rounded text-sm transition">
              登記罰款
            </button>
          </div>
        </div>
      </div>

      <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-lg p-4">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-md font-bold text-slate-200">龍虎榜紀錄</h3>
          <button onclick="exportLeaderboardWhatsApp()" class="bg-green-600 hover:bg-green-500 text-white text-xs font-bold px-3 py-1.5 rounded">
            📲 匯出龍虎榜 (WhatsApp)
          </button>
        </div>
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900 text-slate-400 text-xs uppercase border-b border-slate-700">
            <tr>
              <th class="p-3">日期</th>
              <th class="p-3">名字</th>
              <th class="p-3">罰款</th>
              <th class="p-3">原因</th>
              <th class="p-3 text-center">操作</th>
            </tr>
          </thead>
          <tbody id="penalty-tbody" class="divide-y divide-slate-700/50">
            <!-- 動態載入 -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- 通用 WhatsApp 匯出 Modal 彈窗 -->
  <div id="modal-universal-export" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50 p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-lg p-5 space-y-4 shadow-2xl">
      <h3 id="export-modal-title" class="text-base font-bold text-emerald-400">📤 匯出文字 (WhatsApp 格式)</h3>
      <textarea id="universal-export-textarea" rows="10" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-xs text-emerald-300 font-mono focus:outline-none" readonly></textarea>
      <div class="flex justify-end gap-2">
        <button onclick="closeModal('modal-universal-export')" class="px-4 py-1.5 bg-slate-700 hover:bg-slate-600 text-white text-xs rounded font-bold">關閉</button>
        <button onclick="copyUniversalWhatsAppText()" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs rounded font-bold">複製文字</button>
      </div>
    </div>
  </div>

  <!-- JavaScript 邏輯控制區 -->
  <script>
    // 預設使用者帳號權限
    const accounts = [
      { name: 'Mia', category: '總管理員', role: 'admin' },
      { name: '步兵 A', category: '步兵', role: 'walker' },
      { name: '步兵 B', category: '步兵', role: 'walker' },
      { name: '步兵 C', category: '步兵', role: 'walker' },
      { name: '步兵 D', category: '步兵', role: 'walker' }
    ];

    let currentRole = 'admin';

    // 本地資料儲存
    let walkerPayoutList = JSON.parse(localStorage.getItem('walkerPayoutList')) || [];
    let penaltyList = JSON.parse(localStorage.getItem('penaltyList')) || [];

    // 儲存步兵出糧資料
    function saveWalkerPayoutData() {
      localStorage.setItem('walkerPayoutList', JSON.stringify(walkerPayoutList));
    }

    // 儲存罰款資料
    function savePenaltyData() {
      localStorage.setItem('penaltyList', JSON.stringify(penaltyList));
    }

    // 切換 Tab
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(tabId).classList.remove('hidden');

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-emerald-600', 'text-white', 'shadow');
        btn.classList.add('bg-slate-800', 'text-slate-400');
      });

      const activeBtn = document.getElementById(`btn-${tabId}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-slate-800', 'text-slate-400');
        activeBtn.classList.add('bg-emerald-600', 'text-white', 'shadow');
      }
    }

    // ==========================================
    // 步兵出糧紀錄核心邏輯
    // ==========================================

    // 新增一筆出糧紀錄
    function addWalkerPayoutRecord() {
      const date = document.getElementById('wp-inp-date').value;
      const staff = document.getElementById('wp-inp-staff').value;
      const amount = parseFloat(document.getElementById('wp-inp-amount').value) || 0;
      const method = document.getElementById('wp-inp-method').value;
      const remark = document.getElementById('wp-inp-remark').value || '-';

      if (!date) return alert('請選擇出糧日期！');
      if (!staff) return alert('請選擇步兵名字！');
      if (amount <= 0) return alert('請輸入有效的工資金額！');

      const record = {
        id: `WP_${Date.now()}`,
        date: date,
        staff: staff,
        amount: amount,
        method: method,
        remark: remark,
        paid: false // 預設未打剔 (未轉賬)
      };

      walkerPayoutList.unshift(record);
      saveWalkerPayoutData();

      // 清空金額與備註
      document.getElementById('wp-inp-amount').value = '';
      document.getElementById('wp-inp-remark').value = '';

      renderWalkerPayoutTable();
      alert(`✅ 已成功新增 ${staff} 在 ${date} 的工資紀錄 ($${amount})！`);
    }

    // 切換轉賬狀態 (打剔 / 取消打剔)
    function toggleWalkerPaidStatus(id) {
      const item = walkerPayoutList.find(rec => rec.id === id);
      if (item) {
        item.paid = !item.paid;
        saveWalkerPayoutData();
        renderWalkerPayoutTable();
      }
    }

    // 刪除出糧紀錄
    function deleteWalkerPayoutRecord(id) {
      if (currentRole !== 'admin') return alert('只有總管理員才能刪除出糧紀錄！');
      if (confirm('確定要刪除這條出糧紀錄嗎？')) {
        walkerPayoutList = walkerPayoutList.filter(rec => rec.id !== id);
        saveWalkerPayoutData();
        renderWalkerPayoutTable();
      }
    }

    // 渲染步兵出糧表格
    function renderWalkerPayoutTable() {
      const tbody = document.getElementById('walker-payout-tbody');
      const filterStaff = document.getElementById('wp-filter-staff').value;
      if (!tbody) return;

      let filteredData = walkerPayoutList;
      if (filterStaff !== 'ALL') {
        filteredData = walkerPayoutList.filter(item => item.staff === filterStaff);
      }

      if (filteredData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-slate-500">暫無相關出糧紀錄</td></tr>`;
        return;
      }

      tbody.innerHTML = filteredData.map(rec => `
        <tr class="hover:bg-slate-700/30 transition ${rec.paid ? 'bg-emerald-950/20' : ''}">
          <td class="p-3">
            <label class="inline-flex items-center gap-2 cursor-pointer">
              <input type="checkbox" ${rec.paid ? 'checked' : ''} onchange="toggleWalkerPaidStatus('${rec.id}')" 
                class="w-5 h-5 accent-emerald-500 rounded border-slate-700 bg-slate-900 cursor-pointer">
              <span class="text-xs ${rec.paid ? 'text-emerald-400 font-bold' : 'text-amber-400'}">
                ${rec.paid ? '已轉賬 (✓)' : '待轉賬'}
              </span>
            </label>
          </td>
          <td class="p-3 font-mono text-xs">${rec.date}</td>
          <td class="p-3 font-bold text-white">${rec.staff}</td>
          <td class="p-3 text-emerald-400 font-bold font-mono">HK$ ${rec.amount.toFixed(2)}</td>
          <td class="p-3">
            <span class="px-2 py-0.5 text-xs rounded bg-slate-700 text-slate-200 border border-slate-600">
              ${rec.method}
            </span>
          </td>
          <td class="p-3 text-xs text-slate-400">${rec.remark}</td>
          <td class="p-3 text-center">
            <button onclick="deleteWalkerPayoutRecord('${rec.id}')" class="text-red-400 hover:text-red-300 text-xs px-2 py-1 bg-red-950/40 rounded border border-red-800/40">
              刪除
            </button>
          </td>
        </tr>
      `).join('');
    }

    // 匯出步兵出糧明細 (WhatsApp 格式)
    function exportWalkerPayoutWhatsApp() {
      const selectedStaff = document.getElementById('wp-filter-staff').value;
      if (selectedStaff === 'ALL') {
        return alert('請先在下拉選單中指定選擇「某一位步兵」，再進行 WhatsApp 匯出！');
      }

      const records = walkerPayoutList.filter(rec => rec.staff === selectedStaff);
      if (records.length === 0) {
        return alert(`目前沒有 ${selectedStaff} 的出糧紀錄。`);
      }

      let totalAmount = 0;
      let totalPaid = 0;
      let txt = `💵 *【步兵每日出糧結算單 - ${selectedStaff}】*\n`;
      txt += `----------------------------------------\n`;

      records.forEach(r => {
        const status = r.paid ? '✅ [已轉賬]' : '⏳ [待轉賬]';
        txt += `📅 ${r.date} | $${r.amount.toFixed(2)} | ${r.method} ${status}\n`;
        totalAmount += r.amount;
        if (r.paid) totalPaid += r.amount;
      });

      txt += `----------------------------------------\n`;
      txt += `💰 *總應付工資:* HK$ ${totalAmount.toFixed(2)}\n`;
      txt += `✅ *已結清金額:* HK$ ${totalPaid.toFixed(2)}\n`;
      txt += `⏳ *未結清餘額:* HK$ ${(totalAmount - totalPaid).toFixed(2)}\n`;
      txt += `📌 產生時間: ${new Date().toLocaleString('zh-HK')}`;

      document.getElementById('universal-export-textarea').value = txt;
      document.getElementById('export-modal-title').textContent = `📤 匯出 ${selectedStaff} 出糧紀錄 (WhatsApp)`;
      openModal('modal-universal-export');
    }

    // ==========================================
    // 違規龍虎榜邏輯
    // ==========================================

    function saveNewPenaltyRecord() {
      const staff = document.getElementById('lb-inp-staff').value;
      const amount = parseFloat(document.getElementById('lb-inp-amount').value) || 0;
      const reason = document.getElementById('lb-inp-reason').value || '未填寫';
      const date = document.getElementById('global-system-date').value;

      if (amount <= 0) return alert('請輸入有效的罰款金額！');

      const rec = {
        id: `PN_${Date.now()}`,
        date: date,
        staff: staff,
        amount: amount,
        reason: reason
      };

      penaltyList.unshift(rec);
      savePenaltyData();
      renderLeaderboardData();

      document.getElementById('lb-inp-amount').value = '';
      document.getElementById('lb-inp-reason').value = '';
      alert(`✅ 已錄入 ${staff} 的違規罰款 HK$ ${amount}！`);
    }

    function deletePenaltyRecord(index) {
      if (currentRole !== 'admin') return alert('只有總管理員才有權刪除違規紀錄！');
      if (confirm('確定要刪除這條違規罰款紀錄嗎？')) {
        penaltyList.splice(index, 1);
        savePenaltyData();
        renderLeaderboardData();
      }
    }

    function renderLeaderboardData() {
      const tbody = document.getElementById('penalty-tbody');
      if (!tbody) return;

      if (penaltyList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-500">暫無違規紀錄</td></tr>`;
        return;
      }

      tbody.innerHTML = penaltyList.map((p, idx) => `
        <tr class="hover:bg-slate-700/30 transition">
          <td class="p-3 font-mono text-xs">${p.date}</td>
          <td class="p-3 font-bold text-white">${p.staff}</td>
          <td class="p-3 text-rose-400 font-bold font-mono">HK$ ${Number(p.amount).toFixed(2)}</td>
          <td class="p-3 text-xs text-slate-400">${p.reason}</td>
          <td class="p-3 text-center">
            <button onclick="deletePenaltyRecord(${idx})" class="text-red-400 hover:text-red-300 text-xs px-2 py-1 bg-red-950/40 rounded border border-red-800/40">
              刪除
            </button>
          </td>
        </tr>
      `).join('');
    }

    function exportLeaderboardWhatsApp() {
      const today = document.getElementById('global-system-date').value || new Date().toISOString().split('T')[0];
      const curMonth = today.substring(0, 7);
      const monthPenalties = penaltyList.filter(p => p.date && p.date.startsWith(curMonth));
      const totalJackpot = monthPenalties.reduce((sum, p) => sum + Number(p.amount || 0), 0);

      let txt = `🏆 *【Mia組 - ${curMonth} 月份違規龍虎榜與罰款獎池】*\n`;
      txt += `💰 *當月累計罰款獎池總額:* HK$ ${totalJackpot.toFixed(2)}\n`;
      txt += `----------------------------------------\n`;
      
      monthPenalties.forEach((p, idx) => {
        txt += `[${idx + 1}] *${p.staff}*: $${p.amount} (${p.reason})\n`;
      });
      
      txt += `----------------------------------------\n`;
      txt += `📌 數據時間: ${new Date().toLocaleString('zh-HK')}`;

      document.getElementById('universal-export-textarea').value = txt;
      document.getElementById('export-modal-title').textContent = '📤 匯出違規龍虎榜 (WhatsApp 格式)';
      openModal('modal-universal-export');
    }

    // Modal 與通用工具
    function openModal(id) {
      document.getElementById(id).classList.remove('hidden');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function copyUniversalWhatsAppText() {
      const textarea = document.getElementById('universal-export-textarea');
      textarea.select();
      navigator.clipboard.writeText(textarea.value).then(() => {
        alert('✅ WhatsApp 格式文字已成功複製到剪貼簿！');
      }).catch(() => {
        alert('❌ 複製失敗，請手動複製文字。');
      });
    }

    function changeUserRole(val) {
      const acc = accounts.find(a => a.name === val);
      if (acc) {
        currentRole = acc.role;
        renderRoleView();
      }
    }

    function renderRoleView() {
      const roleSelect = document.getElementById('current-user-role-select');
      if (roleSelect) {
        roleSelect.innerHTML = accounts.map(a => 
          `<option value="${a.name}" ${a.role === currentRole ? 'selected' : ''}>${a.name} (${a.category})</option>`
        ).join('');
      }

      const roleBadge = document.getElementById('role-display-badge');
      if (roleBadge) {
        if (currentRole === 'admin') {
          roleBadge.textContent = '👑 總管理員 (Mia)';
          roleBadge.className = 'px-2 py-0.5 rounded text-xs bg-blue-900/80 text-blue-300 border border-blue-700 font-semibold';
        } else {
          roleBadge.textContent = `👤 當前身份: ${currentRole}`;
          roleBadge.className = 'px-2 py-0.5 rounded text-xs bg-slate-800 text-slate-300 border border-slate-600 font-semibold';
        }
      }
    }

    // 初始化載入
    window.addEventListener('DOMContentLoaded', () => {
      const todayStr = new Date().toISOString().split('T')[0];
      
      document.getElementById('global-system-date').value = todayStr;
      document.getElementById('wp-inp-date').value = todayStr;

      renderRoleView();
      renderWalkerPayoutTable();
      renderLeaderboardData();
    });
  </script>
</body>
</html>
