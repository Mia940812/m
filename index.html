<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mia Group 派送營運工作台</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #e74c3c;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 15px;
      color: #333;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
    }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-danger { background: var(--accent-color); }
    .btn-success { background: #27ae60; }
    .btn-warning { background: #f39c12; }
    .btn-block { width: 100%; display: block; margin-top: 10px; }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin: 6px 0 14px 0;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid var(--border-color); padding: 10px; text-align: left; font-size: 13px; }
    th { background: #f1f5f9; }
    .badge {
      padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white;
    }
    .badge-admin { background: #e74c3c; }
    .badge-staff { background: #3498db; }
    .modal {
      display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.65); justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; }
    .hidden { display: none !important; }
    .alert-banner { background: #fff3cd; color: #856404; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #ffeeba; }
  </style>
</head>
<body>

<div class="container">
  <!-- 頂部資訊列 -->
  <div class="card flex-between">
    <div>
      <h2 style="margin:0;">🚚 Mia Group 派送營運工作台</h2>
      <small id="user-display-status">正在載入系統權限...</small>
    </div>
    <div>
      <button class="btn btn-warning" onclick="switchRoleModal()">🔑 切換權限</button>
      <button class="btn btn-danger" onclick="logout()">🚪 登出</button>
    </div>
  </div>

  <!-- 定時提醒警報 Banner -->
  <div id="hourly-alert-banner" class="alert-banner hidden">
    🔔 <strong>整點營運提醒：</strong> 請檢查未處理之異常件及步兵派送進度！
  </div>

  <!-- 管理員 Mia 專用區塊：違規龍虎榜與罰款獎池 -->
  <div id="admin-panel" class="card hidden">
    <div class="flex-between">
      <h3>🏆 違規龍虎榜與罰款獎池 (Mia 專屬控制台)</h3>
      <span class="badge badge-admin">Admin 權限</span>
    </div>
    
    <div style="background: #f8fafc; padding: 15px; border-radius: 8px; margin: 10px 0;">
      <h4>💰 當月累計罰款獎池金額：<span id="total-jackpot-amount" style="color:#e74c3c; font-size:20px;">HK$ 0.00</span></h4>
    </div>

    <!-- 錄入違規紀錄表單 -->
    <h4>➕ 錄入步兵/司機違規罰款</h4>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
      <div>
        <label>違規日期：</label>
        <input type="date" id="lb-inp-date">
      </div>
      <div>
        <label>責任人員：</label>
        <input type="text" id="lb-inp-staff" placeholder="例如：步兵阿強">
      </div>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px;">
      <div>
        <label>罰款金額 (HK$)：</label>
        <input type="number" id="lb-inp-amount" placeholder="100">
      </div>
      <div>
        <label>違規詳細原因：</label>
        <input type="text" id="lb-inp-reason" placeholder="例如：逾時未送達、遺失包裹">
      </div>
    </div>
    <button class="btn btn-danger btn-block" onclick="saveNewPenaltyRecord()">新增違規罰款紀錄</button>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid var(--border-color);">

    <!-- 違規紀錄清單 -->
    <div class="flex-between">
      <h4>📋 本月違規紀錄總覽</h4>
      <button class="btn btn-success" onclick="exportLeaderboardWhatsApp()">📤 匯出 WhatsApp 格式</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>日期</th>
          <th>人員</th>
          <th>金額 (HK$)</th>
          <th>原因</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="penalty-table-body">
        <tr><td colspan="5" style="text-align:center;">暫無違規紀錄</td></tr>
      </tbody>
    </table>
  </div>

  <!-- 步兵/司機 營運通用區塊 -->
  <div class="card">
    <div class="flex-between">
      <h3>📝 每日營運數據與結算工作台</h3>
      <span class="badge badge-staff" id="staff-badge">步兵/司機權限</span>
    </div>
    
    <label>系統全域日期：</label>
    <input type="date" id="global-system-date" onchange="renderLeaderboardData()">

    <p style="color: #64748b; font-size: 13px;">請填寫每日實際派送件數、實收金額與索償扣款。</p>
  </div>
</div>

<!-- 登入 Modal 彈窗 -->
<div id="login-modal" class="modal hidden">
  <div class="modal-content">
    <h3 style="margin-top:0;">🔐 身份驗證登入</h3>
    <p style="font-size: 13px; color: #666;">預設為步兵介面；輸入總管理員密碼可解鎖 Mia 控制台。</p>
    
    <label>帳號：</label>
    <input type="text" id="login-username" placeholder="請輸入帳號名稱">
    
    <label>密碼：</label>
    <input type="password" id="login-password" placeholder="請輸入密碼">
    
    <button class="btn btn-block" onclick="processLogin()">進入系統</button>
  </div>
</div>

<!-- 萬能匯出彈窗 (WhatsApp) -->
<div id="modal-universal-export" class="modal hidden">
  <div class="modal-content">
    <h3 id="export-modal-title">📤 匯出 WhatsApp 文字</h3>
    <textarea id="universal-export-textarea" rows="10"></textarea>
    <button class="btn btn-success btn-block" onclick="copyUniversalWhatsAppText()">📋 複製剪貼簿</button>
    <button class="btn btn-danger btn-block" onclick="closeModal('modal-universal-export')">關閉</button>
  </div>
</div>

<script>
  // 1. 後端 Apps Script URL 串接 (請替換為你的 Web App URL)
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";

  // 全域變數
  let currentRole = 'staff'; // 預設權限
  let currentUser = 'Guest';
  let penaltyList = [];

  // 🛡️ 核心防護：每一次打開網頁，第一毫秒立刻強制清除瀏覽器儲存的權限快取！
  // 徹底解決步兵點擊網址直接進入 Mia 管理員帳號的問題
  localStorage.clear();
  sessionStorage.clear();

  // 初始化入口
  document.addEventListener('DOMContentLoaded', () => {
    const todayStr = new Date().toISOString().split('T')[0];
    const dateInput = document.getElementById('global-system-date');
    if (dateInput) dateInput.value = todayStr;
    const lbDate = document.getElementById('lb-inp-date');
    if (lbDate) lbDate.value = todayStr;

    // 載入本地快照數據（若有）
    loadData();

    // 顯示登入彈窗
    showLoginModal();
    initHourlyTimer();
  });

  // 登入驗證處理
  function processLogin() {
    const u = document.getElementById('login-username').value.trim();
    const p = document.getElementById('login-password').value.trim();

    if (!u) {
      alert('請輸入帳號！');
      return;
    }

    // 驗證邏輯：只有輸入密碼 940812 才能開啟 Mia 管理員權限
    if (p === '940812') {
      currentUser = u || 'Mia (總管理員)';
      currentRole = 'admin';
    } else {
      currentUser = u;
      currentRole = 'staff';
    }

    closeModal('login-modal');
    renderRoleView();
  }

  function showLoginModal() {
    document.getElementById('login-modal').classList.remove('hidden');
  }

  function switchRoleModal() {
    showLoginModal();
  }

  function logout() {
    localStorage.clear();
    sessionStorage.clear();
    alert('已成功登出系統！');
    location.reload();
  }

  function renderRoleView() {
    const statusText = document.getElementById('user-display-status');
    const adminPanel = document.getElementById('admin-panel');

    if (currentRole === 'admin') {
      statusText.innerHTML = `目前身分：<strong style="color:#e74c3c;">${currentUser} (總管理員 Mia)</strong>`;
      adminPanel.classList.remove('hidden');
    } else {
      statusText.innerHTML = `目前身分：<strong style="color:#3498db;">${currentUser} (步兵/司機)</strong>`;
      adminPanel.classList.add('hidden');
    }
    renderLeaderboardData();
  }

  // 罰款與龍虎榜邏輯
  function saveNewPenaltyRecord() {
    if (currentRole !== 'admin') {
      alert('只有總管理員 Mia 有權錄入違規罰款！');
      return;
    }

    const date = document.getElementById('lb-inp-date').value;
    const staff = document.getElementById('lb-inp-staff').value.trim();
    const amount = Number(document.getElementById('lb-inp-amount').value) || 0;
    const reason = document.getElementById('lb-inp-reason').value.trim();

    if (!date || !staff || amount <= 0 || !reason) {
      alert('請填寫完整違規日期、責任人員、金額及詳細原因！');
      return;
    }

    const newRecord = {
      id: `PN_${Date.now()}`,
      date: date,
      staff: staff,
      amount: amount,
      reason: reason
    };

    penaltyList.unshift(newRecord);
    saveData();
    syncSingleRecord('MIA_PENALTIES_PERFECT', penaltyList);

    document.getElementById('lb-inp-amount').value = '';
    document.getElementById('lb-inp-reason').value = '';

    renderLeaderboardData();
    alert(`✅ 成功錄入 ${staff} 違規罰款 HK$ ${amount.toFixed(2)}！`);
  }

  function deletePenaltyRecord(index) {
    if (currentRole !== 'admin') {
      alert('只有總管理員 Mia 有權刪除違規紀錄！');
      return;
    }

    if (confirm('確定要刪除這條違規罰款紀錄？金額將自動從獎池中扣除。')) {
      penaltyList.splice(index, 1);
      saveData();
      syncSingleRecord('MIA_PENALTIES_PERFECT', penaltyList);
      renderLeaderboardData();
    }
  }

  function renderLeaderboardData() {
    const today = document.getElementById('global-system-date').value || new Date().toISOString().split('T')[0];
    const curMonth = today.substring(0, 7);

    const monthPenalties = penaltyList.filter(p => p.date && p.date.startsWith(curMonth));
    const totalJackpot = monthPenalties.reduce((sum, p) => sum + Number(p.amount || 0), 0);

    document.getElementById('total-jackpot-amount').textContent = `HK$ ${totalJackpot.toFixed(2)}`;

    const tbody = document.getElementById('penalty-table-body');
    if (!tbody) return;

    if (monthPenalties.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">${curMonth} 月份暫無違規紀錄</td></tr>`;
      return;
    }

    tbody.innerHTML = monthPenalties.map((item, idx) => `
      <tr>
        <td>${item.date}</td>
        <td><strong>${item.staff}</strong></td>
        <td style="color:#e74c3c; font-weight:bold;">HK$ ${Number(item.amount).toFixed(2)}</td>
        <td>${item.reason}</td>
        <td>
          ${currentRole === 'admin' ? `<button class="btn btn-danger" style="padding:2px 6px; font-size:12px;" onclick="deletePenaltyRecord(${idx})">刪除</button>` : '-'}
        </td>
      </tr>
    `).join('');
  }

  function exportLeaderboardWhatsApp() {
    const today = document.getElementById('global-system-date').value || new Date().toISOString().split('T')[0];
    const curMonth = today.substring(0, 7);
    const monthPenalties = penaltyList.filter(p => p.date && p.date.startsWith(curMonth));
    const totalJackpot = monthPenalties.reduce((sum, p) => sum + Number(p.amount || 0), 0);

    const riderStats = {};
    monthPenalties.forEach(p => {
      if (!riderStats[p.staff]) riderStats[p.staff] = { count: 0, totalFine: 0 };
      riderStats[p.staff].count += 1;
      riderStats[p.staff].totalFine += Number(p.amount || 0);
    });

    const sortedRiders = Object.keys(riderStats).map(name => ({
      name, count: riderStats[name].count, totalFine: riderStats[name].totalFine
    })).sort((a, b) => b.count - a.count || b.totalFine - a.totalFine);

    let text = `🏆 *Mia組 ${curMonth.split('-')[0]}年${curMonth.split('-')[1]}月 違規龍虎榜與罰款獎池* 🏆\n`;
    text += `------------------------------------\n`;
    text += `💰 *當月累計獎池總額:* HK$ ${totalJackpot.toFixed(2)}\n`;
    text += `------------------------------------\n\n`;
    text += `🔥 *違規排行黑名單 (由多至少):*\n`;

    if (sortedRiders.length === 0) {
      text += `🎉 本月暫無任何違規紀錄，全員表現優良！\n`;
    } else {
      const medals = ['🥇', '🥈', '🥉'];
      sortedRiders.forEach((r, idx) => {
        const medal = idx < 3 ? medals[idx] : `[第${idx + 1}名]`;
        text += `${medal} *${r.name}*: 違規 ${r.count} 次 | 罰款 HK$ ${r.totalFine.toFixed(2)}\n`;
      });
    }

    text += `\n📌 _請各位步兵與司機嚴格遵守派送規範，減少誤派與失件！_`;

    document.getElementById('universal-export-textarea').value = text;
    document.getElementById('export-modal-title').textContent = '📤 匯出違規龍虎榜 WhatsApp 格式';
    openModal('modal-universal-export');
  }

  // 數據持續化與同步
  function saveData() {
    try {
      localStorage.setItem('MIA_PENALTIES_PERFECT', JSON.stringify(penaltyList));
    } catch(e) { console.error('本地儲存失敗', e); }
  }

  function loadData() {
    try {
      const pData = localStorage.getItem('MIA_PENALTIES_PERFECT');
      if (pData) penaltyList = JSON.parse(pData);
    } catch(e) { console.error('本地數據讀取失敗', e); }
  }

  function syncSingleRecord(actionType, dataPayload) {
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes('YOUR_SCRIPT_ID')) return;
    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: actionType, data: dataPayload })
    }).catch(err => console.error('同步失敗:', err));
  }

  // 輔助 UI 控制
  function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
  function copyUniversalWhatsAppText() {
    const txt = document.getElementById('universal-export-textarea');
    txt.select();
    document.execCommand('copy');
    alert('📋 已成功複製 WhatsApp 格式內容至剪貼簿！');
  }

  // 整點音效提醒邏輯
  function initHourlyTimer() {
    setInterval(() => {
      const min = new Date().getMinutes();
      const sec = new Date().getSeconds();
      if (min === 0 && sec === 0) {
        triggerAudioAlert();
        document.getElementById('hourly-alert-banner').classList.remove('hidden');
      }
    }, 1000);
  }

  function triggerAudioAlert() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.5);
    } catch(e) {}
  }
</script>

</body>
</html>
