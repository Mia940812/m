<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mia組 - 派件營運全功能工作台</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .hidden-section { display: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">

    <!-- 登入畫面 -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 border border-slate-100">
            <div class="text-center mb-8">
                <div class="bg-indigo-50 text-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                    <i class="fa-solid fa-truck-fast"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Mia組 派件營運</h1>
                <p class="text-sm text-slate-500 mt-1">請選擇身分與帳戶登入系統</p>
            </div>
            
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">選擇身分 / 帳戶</label>
                    <select id="user-select" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50 text-slate-700 font-medium">
                        <option value="" disabled selected>-- 請選擇操作帳戶 --</option>
                        <optgroup label="總管理員">
                            <option value="Mia|admin|all">總管理員：Mia</option>
                        </optgroup>
                        <optgroup label="A隊 (組長：詠豪)">
                            <option value="詠豪|leader|A">組長：詠豪 (A01 - A隊)</option>
                            <option value="周健|member|A">步兵：周健 (A03 - A隊)</option>
                            <option value="黃奕烽|member|A">步兵：黃奕烽 (A04 - A隊)</option>
                        </optgroup>
                        <optgroup label="B隊 (組長：景鴻)">
                            <option value="景鴻|leader|B">組長：景鴻 (B03 - B隊)</option>
                            <option value="小肥|member|B">步兵：小肥 (B01 - B隊)</option>
                            <option value="吳嘉榮|member|B">步兵：吳嘉榮 (B02 - B隊)</option>
                        </optgroup>
                        <optgroup label="C隊 (組長：俊華)">
                            <option value="俊華|leader|C">組長：俊華 (C02 - C隊)</option>
                            <option value="張兆偉|member|C">步兵：張兆偉 (C01 - C隊)</option>
                        </optgroup>
                        <optgroup label="KM隊 (組長兼管/步兵群)">
                            <option value="盧智聰|member|KM">步兵：盧智聰 (KM04 - KM隊)</option>
                            <option value="姜嘉敏 KK|member|KM">步兵：姜嘉敏 KK (KM05 - KM隊)</option>
                            <option value="倪志康|member|KM">步兵：倪志康 (KM06 - KM隊)</option>
                            <option value="吳瑋儒|member|KM">步兵：吳瑋儒 (KM07 - KM隊)</option>
                            <option value="王利民|member|KM">步兵：王利民 (KM08 - KM隊)</option>
                        </optgroup>
                    </select>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-indigo-100">
                    進入工作台
                </button>
            </form>
        </div>
    </div>

    <!-- 主工作台畫面 -->
    <div id="app-screen" class="hidden-section min-h-screen flex flex-col">
        <!-- 頂部導覽列 -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="bg-indigo-600 text-white w-10 h-10 rounded-xl flex items-center justify-center font-bold">
                        <i class="fa-solid fa-box-open"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-slate-800 text-base leading-tight">Mia組營運工作台</h2>
                        <p class="text-xs text-slate-500" id="current-user-badge">身分載入中...</p>
                    </div>
                </div>

                <div class="flex items-center space-x-3">
                    <!-- 代操作選單 (管理者與組長專用) -->
                    <div id="impersonate-container" class="hidden-section flex items-center space-x-2 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-200">
                        <span class="text-xs font-semibold text-slate-500"><i class="fa-solid fa-user-gear mr-1"></i>代操作:</span>
                        <select id="impersonate-select" onchange="switchImpersonation(this.value)" class="text-xs bg-transparent font-medium text-slate-700 focus:outline-none cursor-pointer">
                            <!-- 動態填入 -->
                        </select>
                    </div>

                    <button onclick="handleLogout()" class="bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 px-3.5 py-2 rounded-xl text-sm font-semibold transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>登出</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- 內容主體 -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
            <!-- 數據卡片列 -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">今日總派件數</p>
                    <h3 class="text-2xl font-bold text-slate-800 mt-1">1,248 <span class="text-xs font-normal text-emerald-500"><i class="fa-solid fa-arrow-up"></i> 12%</span></h3>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">異常工單數</p>
                    <h3 class="text-2xl font-bold text-rose-600 mt-1">5 筆</h3>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">罰款獎池總額</p>
                    <h3 class="text-2xl font-bold text-indigo-600 mt-1">$1,450</h3>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">團隊營運狀態</p>
                    <h3 class="text-2xl font-bold text-emerald-600 mt-1">運作順暢</h3>
                </div>
            </div>

            <!-- 核心功能區塊 -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                    <h3 class="font-bold text-slate-800 text-lg flex items-center space-x-2">
                        <i class="fa-solid fa-clipboard-list text-indigo-600"></i>
                        <span id="section-title">每日派件報數與作業管理</span>
                    </h3>
                    <button onclick="exportWhatsApp()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-4 py-2 rounded-xl transition flex items-center space-x-1.5 shadow-sm">
                        <i class="fa-brands fa-whatsapp text-sm"></i>
                        <span>導出 WhatsApp 格式</span>
                    </button>
                </div>
                <div class="text-slate-600 text-sm space-y-3">
                    <p>當前操作帳戶：<strong id="active-account-display" class="text-indigo-600"></strong></p>
                    <p class="text-slate-500">在此區域可進行派件數據填報、區域排班調度、異常工單舉證拍照與薪資結算查詢。</p>
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 mt-4">
                        <span class="font-semibold text-slate-700 block mb-2">快速填報表單範例：</span>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <input type="text" placeholder="輸入派件數量" class="bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm">
                            <input type="text" placeholder="備註或異常說明" class="bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm">
                            <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-lg py-2 transition">提交數據</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript 邏輯控制 -->
    <script>
        // 完整人員與權限對照表
        const allUsers = [
            { name: "Mia", role: "admin", team: "all", label: "總管理員：Mia" },
            { name: "詠豪", role: "leader", team: "A", label: "組長：詠豪 (A01 - A隊)" },
            { name: "周健", role: "member", team: "A", label: "步兵：周健 (A03 - A隊)" },
            { name: "黃奕烽", role: "member", team: "A", label: "步兵：黃奕烽 (A04 - A隊)" },
            { name: "景鴻", role: "leader", team: "B", label: "組長：景鴻 (B03 - B隊)" },
            { name: "小肥", role: "member", team: "B", label: "步兵：小肥 (B01 - B隊)" },
            { name: "吳嘉榮", role: "member", team: "B", label: "步兵：吳嘉榮 (B02 - B隊)" },
            { name: "俊華", role: "leader", team: "C", label: "組長：俊華 (C02 - C隊)" },
            { name: "張兆偉", role: "member", team: "C", label: "步兵：張兆偉 (C01 - C隊)" },
            { name: "盧智聰", role: "member", team: "KM", label: "步兵：盧智聰 (KM04 - KM隊)" },
            { name: "姜嘉敏 KK", role: "member", team: "KM", label: "步兵：姜嘉敏 KK (KM05 - KM隊)" },
            { name: "倪志康", role: "member", team: "KM", label: "步兵：倪志康 (KM06 - KM隊)" },
            { name: "吳瑋儒", role: "member", team: "KM", label: "步兵：吳瑋儒 (KM07 - KM隊)" },
            { name: "王利民", role: "member", team: "KM", label: "步兵：王利民 (KM08 - KM隊)" }
        ];

        let currentUser = null;
        let activeOperatingUser = null;

        function handleLogin(event) {
            event.preventDefault();
            const selectVal = document.getElementById('user-select').value;
            if (!selectVal) {
                alert('請先選擇帳戶！');
                return;
            }

            const [name, role, team] = selectVal.split('|');
            currentUser = { name, role, team };
            activeOperatingUser = { ...currentUser };

            // 切換畫面
            document.getElementById('login-screen').classList.add('hidden-section');
            document.getElementById('app-screen').classList.remove('hidden-section');

            updateUI();
        }

        function updateUI() {
            // 更新狀態顯示
            document.getElementById('current-user-badge').innerText = `登入身分: ${currentUser.name} (${getRoleName(currentUser.role)})`;
            document.getElementById('active-account-display').innerText = `${activeOperatingUser.name} [組別: ${activeOperatingUser.team}]`;

            // 處理代操作選單權限
            const impersonateContainer = document.getElementById('impersonate-container');
            const impersonateSelect = document.getElementById('impersonate-select');
            impersonateSelect.innerHTML = '';

            if (currentUser.role === 'admin') {
                impersonateContainer.classList.remove('hidden-section');
                allUsers.forEach(u => {
                    const opt = document.createElement('option');
                    opt.value = u.name;
                    opt.text = u.label;
                    if (u.name === activeOperatingUser.name) opt.selected = true;
                    impersonateSelect.appendChild(opt);
                });
            } else if (currentUser.role === 'leader') {
                impersonateContainer.classList.remove('hidden-section');
                // 組長只能代操作自己組別的成員或自己
                const groupMembers = allUsers.filter(u => u.team === currentUser.team || u.name === currentUser.name);
                groupMembers.forEach(u => {
                    const opt = document.createElement('option');
                    opt.value = u.name;
                    opt.text = u.label;
                    if (u.name === activeOperatingUser.name) opt.selected = true;
                    impersonateSelect.appendChild(opt);
                });
            } else {
                impersonateContainer.classList.add('hidden-section');
            }
        }

        function switchImpersonation(targetName) {
            const found = allUsers.find(u => u.name === targetName);
            if (found) {
                activeOperatingUser = { ...found };
                document.getElementById('active-account-display').innerText = `${activeOperatingUser.name} [組別: ${activeOperatingUser.team}]`;
            }
        }

        function handleLogout() {
            currentUser = null;
            activeOperatingUser = null;
            document.getElementById('login-form').reset();
            // 直接回到主畫面重新登入
            document.getElementById('app-screen').classList.add('hidden-section');
            document.getElementById('login-screen').classList.remove('hidden-section');
        }

        function getRoleName(role) {
            if (role === 'admin') return '總管理員';
            if (role === 'leader') return '組長';
            return '步兵';
        }

        function exportWhatsApp() {
            alert(`已成功將 [${activeOperatingUser.name}] 的營運與派件數據轉為 WhatsApp 格式並複製到剪貼簿！`);
        }
    </script>
</body>
</html>
