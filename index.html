<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mia組 - 派件報數與薪酬結算系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

  <!-- 登入卡片 -->
  <div class="w-full max-w-sm bg-white rounded-2xl p-6 shadow-2xl space-y-4">
    <div class="text-center space-y-1">
      <h1 class="text-xl font-bold text-slate-800">派件報數與薪酬結算系統</h1>
      <p class="text-xs text-slate-500">Mia組</p>
      <p id="sync-status" class="text-xs text-emerald-600 font-medium">● 雲端資料庫已就緒</p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 pt-2">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">員工編號</label>
        <input type="text" id="username" required placeholder="例如：KM001" 
               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 uppercase">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">密碼</label>
        <input type="password" id="password" required placeholder="輸入登入密碼" 
               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500">
      </div>
      <button type="submit" 
              class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm transition">
        登入系統
      </button>
    </form>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwPq-iE8oQpD9yT8R3tL4-7mP4eG1s9yvB8h1bF_Q_XQ/exec';

    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim().toUpperCase();
      const p = document.getElementById('password').value.trim();

      if ((u === 'KM001' || u === 'A001') && (p === 'mia888' || p === '100')) {
        alert('登入成功！');
      } else {
        alert('員工編號或密碼錯誤！');
      }
    }
  </script>
</body>
</html>
