<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mia組 - 派件營運全功能工作台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { height: 5px; width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 999px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .app-modal { display: none; position: fixed; inset: 0; z-index: 9999; background-color: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 12px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- 頂部 Header -->
  <header class="bg-slate-900 text-white px-4 py-3 sticky top-0 z-40 shadow-sm bg-opacity-95">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="px-2.5 py-1 bg-slate-800 border border-slate-700 text-blue-400 rounded-lg font-black text-xs tracking-wider">Mia組</div>
        <div>
          <div class="text-xs font-bold text-slate-100 flex items-center gap-1.5">
            <span>派件營運工作台</span>
            <span id="role-display-badge" class="px-1.5 py-0.5 rounded text-[10px] bg-blue-900/80 text-blue-300 border border-blue-700 font-semibold">👑 總管理員 (Mia)</span>
          </div>
          <div id="cloud-status-badge" class="text-[10px] text-emerald-400 font-semibold">🟢 雲端雙向同步連線中...</div>
        </div>
      </div>

      <!-- 身份切換、修改密碼與系統控制 -->
      <div class="flex items-center gap-2 text-xs">
        <div id="account-switch-container" class="flex items-center gap-1.5">
          <span class="text-[11px] text-slate-400 font-bold hidden sm:inline">當前帳戶:</span>
          <select id="current-user-role-select" onchange="promptRoleSwitch(this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 rounded-lg px-2 py-1 font-bold focus:outline-none"></select>
        </div>

        <button type="button" onclick="openChangePasswordModal()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold transition flex items-center gap-1">
          <span>🔑</span> 修改密碼
        </button>
        <button type="button" onclick="logoutCurrentSession()" class="px-2.5 py-1 rounded-lg bg-rose-950/80 hover:bg-rose-900 text-rose-300 border border-rose-800 font-bold transition">
          登出
        </button>
        <input id="global-system-date" type="date" onchange="renderReportsTable()" class="bg-slate-800 border border-slate-700 text-slate-200 rounded-lg px-2 py-1 font-bold focus:outline-none">
        <button type="button" id="btn-reset-sys" onclick="resetSystemData()" title="重置為初始狀態" class="text-[11px] px-2 py-1 rounded-lg bg-slate-800 hover:bg-rose-950 text-slate-400 hover:text-rose-300 transition">重置</button>
      </div>
    </div>
  </header>

  <!-- 核心功能導航欄 -->
  <nav class="bg-white border-b border-slate-200 sticky top-[53px] z-30 shadow-xs">
    <div id="navigation-bar-container" class="max-w-7xl mx-auto px-4 py-2 flex flex-wrap items-center gap-1.5 text-xs font-bold">
      <!-- 🔒 步兵出糧與報數核對 (僅 Mia 總管顯示與操作) -->
      <button type="button" id="btn-nav-recon" onclick="openReconciliationModal()" class="px-3 py-1.5 rounded-xl bg-indigo-700 hover:bg-indigo-800 text-white flex items-center gap-1 shadow-xs"><span>🔍</span> 步兵出糧與報數核對 (Mia專屬)</button>
      <button type="button" onclick="openViolationsModal()" class="px-3 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white flex items-center gap-1 shadow-xs"><span>⚠️</span> 現場違規罰款</button>

      <!-- 🌐 全員公開可見 -->
      <button type="button" onclick="openLeaderboardModal()" class="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white flex items-center gap-1 shadow-xs"><span>🏆</span> 罰款獎池與龍虎榜</button>
      <button type="button" onclick="openTicketsModal()" class="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-800 border border-rose-200 relative">🚨 異常工單 <span id="ticket-badge-count" class="ml-1 px-1.5 py-0.2 bg-rose-600 text-white rounded-full text-[9px]">47</span></button>
      <button type="button" onclick="openUniversalExportModal('truck_dispatch')" class="px-3 py-1.5 rounded-xl bg-slate-900 text-white flex items-center gap-1 shadow-xs"><span>🚗</span> 匯出車線</button>
      <button type="button" onclick="openModal2()" class="px-3 py-1.5 rounded-xl bg-blue-700 hover:bg-blue-800 text-white shadow-xs">👥 2- 區域分工排班</button>
      <button type="button" onclick="openModal8()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200">🚗 8- 司機車線</button>
      <button type="button" onclick="openModalProgress()" class="px-3 py-1.5 rounded-xl bg-blue-50 text-blue-900 border border-blue-200 font-black">⏱️ 各區工作進度</button>
      <button type="button" onclick="openModal5()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200">⏰ 5- 14天報更</button>
      <button type="button" onclick="openUniversalExportModal('shift_schedule')" class="px-3 py-1.5 rounded-xl bg-slate-800 text-white flex items-center gap-1 shadow-xs"><span>📤</span> 匯出更表</button>

      <!-- 👑 Mia 專屬功能 (非 Mia 完全隱藏) -->
      <button type="button" id="btn-nav-profit" onclick="openModalProfit()" class="px-3 py-1.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white shadow-xs">📈 營運利潤</button>
      <button type="button" id="btn-nav-settle" onclick="openModalSettlementDaily()" class="px-3 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white shadow-xs">💰 詳細分區埋數</button>
      <button type="button" id="btn-nav-supplies" onclick="openSuppliesModal()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200">📦 物資採購</button>
      <button type="button" id="btn-nav-m1" onclick="openModal1()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200">📍 1- 圍欄管理</button>
      <button type="button" id="btn-nav-m3" onclick="openModal3()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200">📦 3- 觀塘貨量</button>
      <button type="button" id="btn-nav-m4" onclick="openModal4()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200">🏢 4- 東區貨量</button>
      <button type="button" id="btn-nav-mst" onclick="openModalStCounts()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200">🏞️ 4b- 沙田貨量</button>
      <button type="button" id="btn-nav-recruits" onclick="openRecruitsModal()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200">📋 預約新人</button>
      <button type="button" id="btn-nav-addrider" onclick="openAddRiderModal()" class="px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white shadow-xs">➕ 人員名冊/票價</button>
    </div>
  </nav>

  <!-- 主內容工作區 -->
  <main class="max-w-7xl mx-auto p-3 sm:p-5 flex-1 w-full space-y-4">
    <!-- 每日派件報數與薪資結算表單 -->
    <div id="report-entry-panel" class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-xs space-y-4">
      <div class="border-b border-slate-100 pb-2.5 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <h2 id="report-entry-title" class="text-xs sm:text-sm font-black text-slate-900 flex items-center gap-2">
            <span class="w-2 h-4 bg-slate-800 rounded"></span> 📝 每日派件報數與薪資結算表單
          </h2>
          <button type="button" id="btn-price-settings-top" onclick="openModalPriceSettings()" class="px-2.5 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold shadow-xs transition">⚙️ 修改全域預設票價</button>
        </div>
        <span id="role-hint-text" class="text-[11px] text-slate-400 font-semibold">自動匹配專屬單價 ➜ 實時計算同步</span>
      </div>

      <form onsubmit="saveFullDailyReport(event)" class="space-y-4 text-xs">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 bg-slate-50/80 p-3 rounded-xl border border-slate-200">
          <div>
            <label class="block font-bold text-slate-700 mb-1">派送日期</label>
            <input type="date" id="repDate" required class="w-full px-3 py-1.5 bg-white border border-slate-300 rounded-lg font-bold">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">司機 / 步兵身份 (已匹配專屬票價)</label>
            <select id="repStaffSelect" onchange="onStaffSelectChange(this.value)" required class="w-full px-3 py-1.5 bg-white border border-slate-300 rounded-lg font-bold text-slate-900"></select>
          </div>
        </div>

        <!-- 1. 分區派件票數 -->
        <div class="p-3.5 bg-slate-50/60 rounded-xl border border-slate-200 space-y-2.5">
          <div class="font-bold text-slate-800 flex items-center justify-between text-xs">
            <span>📦 1. 分區派件報數</span>
            <span id="staff-price-badge" class="text-[11px] font-bold text-blue-700">當前套用：專屬單價</span>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-4 gap-2">
            <div class="bg-white p-2.5 rounded-lg border border-slate-200 space-y-1.5">
              <div class="font-bold text-slate-700 flex justify-between items-center">
                <span>📍 東區</span>
                <span id="preview-east-img" class="text-[10px] text-emerald-600 font-bold"></span>
              </div>
              <div class="flex items-center gap-1">
                <input type="number" id="repEastCount" min="0" placeholder="票數" oninput="calcSalaryLive()" class="w-1/2 p-1.5 bg-slate-50 border rounded text-center font-bold text-blue-700">
                <span class="text-slate-400">×$</span>
                <input type="number" id="repEastPrice" step="0.1" placeholder="單價" oninput="calcSalaryLive()" class="w-1/2 p-1.5 bg-slate-50 border rounded text-center font-bold">
              </div>
              <div class="pt-1 border-t border-slate-100">
                <label class="block text-[10px] text-slate-500 font-bold mb-0.5">📷 東區報數照片：</label>
                <input type="file" id="img-east-report" accept="image/*" onchange="handleImagePreview(this, 'preview-east-img')" class="w-full text-[10px] text-slate-400 file:mr-1.5 file:py-0.5 file:px-2 file:rounded file:border-0 file:text-[10px] file:font-semibold file:bg-blue-50 file:text-blue-700">
              </div>
            </div>
            <div class="bg-white p-2.5 rounded-lg border border-slate-200 space-y-1.5">
              <div class="font-bold text-slate-700">📍 觀塘麗港城</div>
              <div class="flex items-center gap-1">
                <input type="number" id="repKtLgCount" min="0" placeholder="票數" oninput="calcSalaryLive()" class="w-1/2 p-1.5 bg-slate-50 border rounded text-center font-bold text-blue-700">
                <span class="text-slate-400">×$</span>
                <input type="number" id="repKtLgPrice" step="0.1" placeholder="單價" oninput="calcSalaryLive()" class="w-1/2 p-1.5 bg-slate-50 border rounded text-center font-bold">
              </div>
            </div>
            <div class="bg-white p-2.5 rounded-lg border border-slate-200 space-y-1.5">
              <div class="font-bold text-slate-700">📍 觀塘工商區</div>
              <div class="flex items-center gap-1">
                <input type="number" id="repKtIndCount" min="0" placeholder="票數" oninput="calcSalaryLive()" class="w-1/2 p-1.5 bg-slate-50 border rounded text-center font-bold text-blue-700">
                <span class="text-slate-400">×$</span>
                <input type="number" id="repKtIndPrice" step="0.1" placeholder="單價" oninput="calcSalaryLive()" class="w-1/2 p-1.5 bg-slate-50 border rounded text-center font-bold">
              </div>
            </div>
            <div class="bg-white p-2.5 rounded-lg border border-slate-200 space-y-1.5">
              <div class="font-bold text-slate-700">📍 沙田 F58</div>
              <div class="flex items-center gap-1">
                <input type="number" id="repStCount" min="0" placeholder="票數" oninput="calcSalaryLive()" class="w-1/2 p-1.5 bg-slate-50 border rounded text-center font-bold text-blue-700">
                <span class="text-slate-400">×$</span>
                <input type="number" id="repStPrice" step="0.1" placeholder="單價" oninput="calcSalaryLive()" class="w-1/2 p-1.5 bg-slate-50 border rounded text-center font-bold">
              </div>
            </div>
          </div>
        </div>

        <!-- 2. 津貼與實發結算 -->
        <div class="p-3.5 bg-slate-50/60 rounded-xl border border-slate-200 space-y-2.5">
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <div><label class="block font-bold text-slate-600 mb-1">🚗 車津 ($)</label><input type="number" id="repCarAllowance" min="0" value="0" oninput="calcSalaryLive()" class="w-full p-1.5 bg-white border rounded-lg font-bold"></div>
            <div><label class="block font-bold text-slate-600 mb-1">🧾 Claim 報銷 ($)</label><input type="number" id="repClaim" min="0" value="0" oninput="calcSalaryLive()" class="w-full p-1.5 bg-white border rounded-lg font-bold"></div>
            <div><label class="block font-bold text-slate-600 mb-1">🎁 Bonus 獎金 ($)</label><input type="number" id="repBonus" min="0" value="0" oninput="calcSalaryLive()" class="w-full p-1.5 bg-white border rounded-lg font-bold"></div>
            <div><label class="block font-bold text-rose-700 mb-1">🚨 工單賠付+罰款 ($)</label><input type="number" id="repPenalty" min="0" value="0" oninput="calcSalaryLive()" class="w-full p-1.5 bg-white border border-rose-300 rounded-lg font-bold text-rose-600"></div>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-1">
            <div><label class="block font-bold text-slate-600 mb-1">上期預支剩餘 ($)</label><input type="number" id="repPrevAdvance" min="0" value="0" oninput="calcSalaryLive()" class="w-full p-1.5 bg-white border rounded-lg font-bold"></div>
            <div><label class="block font-bold text-slate-600 mb-1">本次預支 ($)</label><input type="number" id="repNewAdvance" min="0" value="0" oninput="calcSalaryLive()" class="w-full p-1.5 bg-white border rounded-lg font-bold"></div>
            <div><label class="block font-bold text-rose-700 mb-1">本日扣數額 ($)</label><input type="number" id="repDeductAmount" min="0" value="0" oninput="calcSalaryLive()" class="w-full p-1.5 bg-white border border-rose-300 rounded-lg font-bold text-rose-600"></div>
            <div class="bg-slate-100 p-2 rounded-lg border flex flex-col justify-center">
              <span class="text-[10px] font-bold text-slate-500">最新剩餘預支</span>
              <span id="repFinalRemainAdvance" class="font-black text-slate-800 text-xs">HK$ 0.00</span>
            </div>
          </div>
          <div class="bg-white p-2.5 rounded-xl border border-slate-200 flex justify-between items-center mt-1">
            <span class="font-bold text-slate-700 text-xs">當日應發總工資結算：</span>
            <span id="repLiveTotalSalary" class="font-black text-slate-900 text-sm">HK$ 0.00</span>
          </div>
        </div>

        <button type="submit" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs shadow-sm transition">
          確認提交報數紀錄 (同步 Google Sheet)
        </button>
      </form>
    </div>

    <!-- 埋數與工資核對清單 (🔒 只有 Mia 總管看得到) -->
    <div id="section-daily-settle-table" class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden" style="display: none;">
      <div class="p-3.5 border-b border-slate-100 flex flex-wrap items-center justify-between gap-2">
        <h3 id="table-heading-title" class="font-bold text-xs text-slate-900">📋 當日詳細埋數與工資結算核對清單 (Mia 專屬)</h3>
        <div class="flex items-center gap-2">
          <button type="button" onclick="pullAllCloudData()" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-[11px] font-bold shadow-xs transition">🔄 重新整理雲端報數</button>
          <button type="button" onclick="exportDailyReportsText()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-white rounded text-[11px] font-bold">📤 匯出今日報數</button>
          <button type="button" id="btn-clear-reports" onclick="clearReports()" class="text-[11px] text-slate-400 hover:text-rose-600 font-bold transition">清空今日報數</button>
        </div>
      </div>
      <div class="overflow-x-auto custom-scrollbar">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-50 text-slate-500 font-bold border-b border-slate-100">
            <tr>
              <th class="p-3">日期</th>
              <th class="p-3">人員 (身份/週期)</th>
              <th class="p-3 text-center">分區票數 (東/麗/工/沙)</th>
              <th class="p-3 text-right">總票數</th>
              <th class="p-3 text-right">津貼/扣數</th>
              <th class="p-3 text-right">實發工資</th>
              <th class="p-3 text-center">轉賬狀態</th>
              <th class="p-3 text-center">操作</th>
            </tr>
          </thead>
          <tbody id="reportTableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- 模態視窗與 JavaScript 邏輯控制完整內置在上下文中 -->

</body>
</html>
