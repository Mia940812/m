<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mia組 - 派件報數與薪酬結算系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 4.5rem); }
    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- 1. 登入介面 -->
  <div id="view-login" class="flex-1 flex items-center justify-center p-4 min-h-screen bg-slate-900">
    <div class="w-full max-w-md bg-white rounded-3xl p-8 shadow-2xl space-y-6">
      <div class="text-center space-y-2">
        <div class="inline-flex px-3 py-1 bg-blue-600 text-white text-xs font-black rounded-lg tracking-wider">Mia Logistics</div>
        <h1 class="text-2xl font-black text-slate-800">派件報數與薪酬系統</h1>
        <p class="text-xs text-blue-600 font-bold">東區 ｜ 觀塘 專用</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 pt-2">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">員工編號 / 帳號</label>
          <input type="text" id="loginUser" required placeholder="例如：KM001" 
                 class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold uppercase focus:outline-none focus:ring-2 focus:ring-blue-600">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">密碼</label>
          <input type="password" id="loginPass" required placeholder="輸入密碼" 
                 class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-600">
        </div>
        <button type="submit" class="w-full py-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-black rounded-2xl text-sm shadow-xl shadow-blue-600/30 transition">
          登入系統
        </button>
      </form>
      <div class="text-center text-[11px] text-slate-400">總管理員預設：KM001 / mia888</div>
    </div>
  </div>

  <!-- 2. 主系統介面 -->
  <div id="view-main" class="hidden flex-1 flex flex-col pb-safe md:pb-6">
    
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
      <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-black text-sm">Mia</div>
          <div>
            <div class="text-sm font-black text-slate-900">派件營運結算系統</div>
            <div class="text-[10px] text-emerald-600 font-bold">● 系統運作正常</div>
          </div>
        </div>

        <!-- 電腦版導航 -->
        <nav class="hidden md:flex items-center space-x-1 bg-slate-100 p-1 rounded-2xl border border-slate-200">
          <button onclick="switchTab('report')" id="d-tab-report" class="tab-btn-d px-5 py-2 rounded-xl text-xs font-black bg-white text-blue-600 shadow-sm transition">每日報數</button>
          <button onclick="switchTab('salary')" id="d-tab-salary" class="tab-btn-d px-5 py-2 rounded-xl text-xs font-bold text-slate-600 hover:text-slate-900 transition">薪酬結算</button>
        </nav>

        <div class="flex items-center space-x-2">
          <span id="currentUserTag" class="text-xs bg-slate-100 text-slate-700 px-3 py-1.5 rounded-xl font-bold">KM001</span>
          <button onclick="handleLogout()" class="p-2 text-slate-400 hover:text-red-600 rounded-xl transition">登出</button>
        </div>
      </div>
    </header>

    <!-- 內容區 -->
    <main class="max-w-6xl mx-auto p-4 flex-1 w-full space-y-6">

      <!-- TAB 1: 每日報數 -->
      <section id="panel-report" class="tab-panel space-y-5">
        
        <!-- 數據統計卡 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
            <div class="text-xs font-bold text-slate-500">今日總票數</div>
            <div id="statTodayCount" class="text-2xl font-black text-blue-600 mt-1">0 票</div>
          </div>
          <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
            <div class="text-xs font-bold text-slate-500">總報數筆數</div>
            <div id="statTotalRows" class="text-2xl font-black text-slate-800 mt-1">0 筆</div>
          </div>
          <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
            <div class="text-xs font-bold text-slate-500">東區累積票數</div>
            <div id="statEastCount" class="text-2xl font-black text-emerald-600 mt-1">0 票</div>
          </div>
          <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
            <div class="text-xs font-bold text-slate-500">觀塘累積票數</div>
            <div id="statKtCount" class="text-2xl font-black text-purple-600 mt-1">0 票</div>
          </div>
        </div>

        <!-- 報數輸入表單 (完全自由輸入，不強加名單) -->
        <div class="bg-white p-5 md:p-6 rounded-3xl border border-slate-200 shadow-sm">
          <h2 class="text-base font-black text-slate-900 mb-4 flex items-center gap-2">
            <span class="w-2 h-4 bg-blue-600 rounded-full"></span> 提交派件報數
          </h2>
          <form onsubmit="saveReport(event)" class="grid grid-cols-1 md:grid-cols-5 gap-3 md:gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1.5">派送日期</label>
              <input type="date" id="repDate" required class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1.5">所屬區域</label>
              <select id="repArea" required class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold">
                <option value="東區">東區</option>
                <option value="觀塘">觀塘</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1.5">司機 / 步兵 / 車線</label>
              <input type="text" id="repStaff" placeholder="輸入人員名稱或車線" required class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1.5">派件總票數 (票)</label>
              <input type="number" id="repCount" min="1" placeholder="輸入票數" required class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-blue-600">
            </div>
            <div class="flex items-end">
              <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-black rounded-xl text-sm shadow-lg shadow-blue-600/20 transition">
                儲存並同步
              </button>
            </div>
          </form>
        </div>

        <!-- 報數清單列表 -->
        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="p-4 md:p-5 border-b border-slate-100 flex items-center justify-between">
            <h3 class="font-black text-sm text-slate-900">即時報數明細清單</h3>
            <button onclick="clearAllData()" class="text-[11px] text-slate-400 hover:text-red-500 font-semibold">清空重設</button>
          </div>
          <div class="overflow-x-auto custom-scroll">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 text-slate-500 font-bold border-b border-slate-100">
                <tr>
                  <th class="p-4">派送日期</th>
                  <th class="p-4">區域</th>
                  <th class="p-4">司機 / 步兵 / 車線</th>
                  <th class="p-4 text-right">票數</th>
                  <th class="p-4 text-center">操作</th>
                </tr>
              </thead>
              <tbody id="reportTableBody" class="divide-y divide-slate-100">
                <tr>
                  <td colspan="5" class="p-8 text-center text-slate-400">暫無記錄，請由上方表單新增。</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- TAB 2: 薪酬結算 -->
      <section id="panel-salary" class="tab-panel hidden space-y-4">
        <div class="bg-white p-5 md:p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
          <h2 class="text-base font-black text-slate-900">薪酬結算總覽</h2>
          <div class="p-6 bg-gradient-to-br from-amber-50 to-orange-50 rounded-2xl border border-amber-200 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div>
              <div class="text-xs font-bold text-amber-800">今日應發結算總額</div>
              <div id="salaryBigTotal" class="text-3xl font-black text-amber-900 mt-1">HK$ 0.00</div>
            </div>
            <div class="text-xs text-amber-700 font-medium bg-white px-4 py-2 rounded-xl border border-amber-200">
              計算公式：總票數 × $8.5
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- 手機端底部選單 -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2 flex justify-around items-center z-50 shadow-lg">
      <button onclick="switchTab('report')" id="m-tab-report" class="flex flex-col items-center gap-1 text-blue-600 font-black">
        <span class="text-xs">每日報數</span>
      </button>
      <button onclick="switchTab('salary')" id="m-tab-salary" class="flex flex-col items-center gap-1 text-slate-400 font-bold">
        <span class="text-xs">薪酬結算</span>
      </button>
    </nav>

  </div>

  <script>
    let reports = JSON.parse(localStorage.getItem('mia_reports_clean') || '[]');

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('repDate').valueAsDate = new Date();
      updateAllDisplays();
    });

    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('loginUser').value.trim().toUpperCase();
      const p = document.getElementById('loginPass').value.trim();

      const users = { 'KM001': 'mia888', 'A001': '100', 'B001': '201' };

      if (users[u] && users[u] === p) {
        document.getElementById('view-login').classList.add('hidden');
        document.getElementById('view-main').classList.remove('hidden');
        document.getElementById('currentUserTag').textContent = u;
      } else {
        alert('員工編號或密碼不正確！');
      }
    }

    function handleLogout() {
      document.getElementById('view-main').classList.add('hidden');
      document.getElementById('view-login').classList.remove('hidden');
      document.getElementById('loginPass').value = '';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-panel').forEach(el => el.classList.add('hidden'));
      document.getElementById(`panel-${tab}`).classList.remove('hidden');

      document.querySelectorAll('.tab-btn-d').forEach(btn => {
        btn.className = 'tab-btn-d px-5 py-2 rounded-xl text-xs font-bold text-slate-600 hover:text-slate-900 transition';
      });
      const activeDBtn = document.getElementById(`d-tab-${tab}`);
      if (activeDBtn) activeDBtn.className = 'tab-btn-d px-5 py-2 rounded-xl text-xs font-black bg-white text-blue-600 shadow-sm transition';

      ['report', 'salary'].forEach(t => {
        const mBtn = document.getElementById(`m-tab-${t}`);
        if (mBtn) {
          mBtn.className = t === tab ? 'flex flex-col items-center gap-1 text-blue-600 font-black' : 'flex flex-col items-center gap-1 text-slate-400 font-bold';
        }
      });
    }

    function saveReport(e) {
      e.preventDefault();
      const date = document.getElementById('repDate').value;
      const area = document.getElementById('repArea').value;
      const staff = document.getElementById('repStaff').value.trim();
      const count = parseInt(document.getElementById('repCount').value, 10);

      reports.unshift({ id: Date.now(), date, area, staff, count });
      localStorage.setItem('mia_reports_clean', JSON.stringify(reports));

      updateAllDisplays();
      document.getElementById('repStaff').value = '';
      document.getElementById('repCount').value = '';
      alert('已成功登記！');
    }

    function deleteItem(id) {
      if (confirm('確定刪除此筆記錄？')) {
        reports = reports.filter(r => r.id !== id);
        localStorage.setItem('mia_reports_clean', JSON.stringify(reports));
        updateAllDisplays();
      }
    }

    function clearAllData() {
      if (confirm('確定要清空所有報數記錄重新開始嗎？')) {
        reports = [];
        localStorage.removeItem('mia_reports_clean');
        updateAllDisplays();
      }
    }

    function updateAllDisplays() {
      const tbody = document.getElementById('reportTableBody');
      let totalCount = 0;
      let eastCount = 0;
      let ktCount = 0;

      if (reports.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-400">暫無記錄，請由上方表單新增。</td></tr>';
      } else {
        tbody.innerHTML = reports.map(r => {
          const num = Number(r.count || 0);
          totalCount += num;
          if (r.area === '東區') eastCount += num;
          if (r.area === '觀塘') ktCount += num;

          return `
            <tr class="hover:bg-slate-50 transition">
              <td class="p-4 font-semibold text-slate-700">${r.date}</td>
              <td class="p-4 font-bold text-slate-800">${r.area}</td>
              <td class="p-4 font-black text-slate-900">${r.staff}</td>
              <td class="p-4 text-right font-black text-blue-600 text-sm">${num} 票</td>
              <td class="p-4 text-center">
                <button onclick="deleteItem(${r.id})" class="text-red-500 hover:text-red-700 font-bold text-xs">刪除</button>
              </td>
            </tr>
          `;
        }).join('');
      }

      document.getElementById('statTodayCount').textContent = `${totalCount} 票`;
      document.getElementById('statTotalRows').textContent = `${reports.length} 筆`;
      document.getElementById('statEastCount').textContent = `${eastCount} 票`;
      document.getElementById('statKtCount').textContent = `${ktCount} 票`;

      const estSalary = (totalCount * 8.5).toFixed(2);
      document.getElementById('salaryBigTotal').textContent = `HK$ ${estSalary}`;
    }
  </script>
</body>
</html>
